// --- Progreso 6: Alertas IDEAM (hidrologia, deslizamientos, incendios). ---
// Mapa Leaflet independiente del Monitor principal, inicializado solo la
// primera vez que se abre la pestana. Se alimenta de IDEAM_Alerts/*.geojson
// (generados a diario por .github/workflows/fetch-ideam.yml). Son indices
// de amenaza de IDEAM, no eventos confirmados -- nunca se mezclan con la
// base de eventos (Events/) ni con el mapa del Monitor.
let ideamMap = null;
let ideamLayersControl = null;
let ideamLegendControl = null;
const ideamGeoLayers = {};   // { hidro, desliz, incendios } -> L.geoJSON
const ideamRawFeatures = {}; // guarda los features crudos para poder re-generar popups al cambiar de idioma
let ideamLastRunUtc = null; // guarda el timestamp crudo para poder re-traducir el prefijo "Actualizado:" al cambiar de idioma

const IDEAM_HIDRO_COLORS = { 'ALERTA ROJA': '#d62828', 'ALERTA NARANJA': '#f08c00', 'ALERTA AMARILLA': '#f1c40f' };
const IDEAM_MUNI_COLORS = { 'ALTA': '#d62828', 'MODERADA': '#f08c00', 'BAJA': '#f1c40f' };

function ideamHidroStyle(feature){
  var nivel = (feature.properties.NIVEL_A || '').toUpperCase();
  return { color: '#333', weight: 1, fillColor: IDEAM_HIDRO_COLORS[nivel] || '#999', fillOpacity: 0.55 };
}
function ideamMuniStyle(feature){
  var nivel = (feature.properties.TEXTO_AMENAZA || '').toUpperCase();
  return { color: '#333', weight: 1, fillColor: IDEAM_MUNI_COLORS[nivel] || '#999', fillOpacity: 0.5 };
}
function ideamNivelLabel(raw){
  var k = (raw || '').toUpperCase();
  if (k.indexOf('ROJA') >= 0) return t('ideamRoja');
  if (k.indexOf('NARANJA') >= 0) return t('ideamNaranja');
  if (k.indexOf('AMARILLA') >= 0) return t('ideamAmarilla');
  if (k === 'ALTA') return t('ideamAlta');
  if (k === 'MODERADA') return t('ideamModerada');
  if (k === 'BAJA') return t('ideamBaja');
  return raw || '';
}
// Progreso 6 (ajuste 27-10-2026): nivel armonizado -- hidrologia usa su propia
// nomenclatura (Alerta Roja/Naranja/Amarilla) y deslizamientos/incendios usan la
// suya (Amenaza Alta/Moderada/Baja), pero ambas comparten la MISMA escala de
// color/severidad. ideamTierLabel() devuelve esa etiqueta comun (Alto/Medio/Bajo)
// para que el usuario no tenga que adivinar la equivalencia entre las 3 capas.
function ideamTierLabel(raw){
  var k = (raw || '').toUpperCase();
  if (k.indexOf('ROJA') >= 0 || k === 'ALTA') return t('ideamTierHigh');
  if (k.indexOf('NARANJA') >= 0 || k === 'MODERADA') return t('ideamTierMedium');
  if (k.indexOf('AMARILLA') >= 0 || k === 'BAJA') return t('ideamTierLow');
  return '';
}
function ideamLayerLabelKey(key){
  if (key === 'hidro') return 'ideamLayerHidro';
  if (key === 'desliz') return 'ideamLayerDesliz';
  return 'ideamLayerIncendios';
}
function ideamHidroPopup(props, layerKey){
  return '<div style="font-size:12px;min-width:190px">' +
    '<div style="font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#6b7583;margin-bottom:2px">' + t(ideamLayerLabelKey(layerKey || 'hidro')) + '</div>' +
    '<b>' + (props.NOMSZH || props.NOMZH || '') + '</b><br>' +
    (props.NOMZH && props.NOMSZH ? props.NOMZH + '<br>' : '') +
    (props.DEP ? props.DEP + '<br>' : '') +
    '<span style="display:inline-block;margin-top:4px;padding:2px 6px;border-radius:4px;background:' + (IDEAM_HIDRO_COLORS[(props.NIVEL_A||'').toUpperCase()] || '#999') + ';color:#fff;font-weight:600">' + ideamTierLabel(props.NIVEL_A) + '</span> ' +
    '<span style="color:#6b7583;font-size:11px">(IDEAM: ' + ideamNivelLabel(props.NIVEL_A) + ')</span><br>' +
    '<span style="color:#6b7583">' + t('ideamPopupSource') + ': IDEAM</span>' +
    '</div>';
}
function ideamMuniPopup(props, layerKey){
  return '<div style="font-size:12px;min-width:170px">' +
    '<div style="font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#6b7583;margin-bottom:2px">' + t(ideamLayerLabelKey(layerKey || 'desliz')) + '</div>' +
    '<b>' + (props.MUNICIPIO || '') + '</b><br>' +
    (props.DEPARTAMENTO || '') + '<br>' +
    '<span style="display:inline-block;margin-top:4px;padding:2px 6px;border-radius:4px;background:' + (IDEAM_MUNI_COLORS[(props.TEXTO_AMENAZA||'').toUpperCase()] || '#999') + ';color:#fff;font-weight:600">' + ideamTierLabel(props.TEXTO_AMENAZA) + '</span> ' +
    '<span style="color:#6b7583;font-size:11px">(IDEAM: ' + ideamNivelLabel(props.TEXTO_AMENAZA) + ')</span><br>' +
    (props.FECHA_EJECUCION ? '<span style="color:#6b7583">' + t('ideamPopupDate') + ': ' + props.FECHA_EJECUCION + '</span><br>' : '') +
    '<span style="color:#6b7583">' + t('ideamPopupSource') + ': IDEAM</span>' +
    '</div>';
}

function renderIdeamLegend(){
  if (!ideamMap || !ideamLegendControl) return;
  var el = ideamLegendControl.getContainer();
  // Progreso 6 (ajuste 27-10-2026): leyenda unica armonizada -- antes mostraba
  // dos listas separadas con nombres distintos para el mismo color, lo que
  // generaba la pregunta de por que "rojo" se llama distinto segun la capa.
  // Ahora cada color tiene una sola etiqueta de severidad (Alto/Medio/Bajo) y,
  // debajo, el termino nativo de IDEAM para cada una de las 3 capas.
  function row(color, tierKey, hidroKey, muniKey){
    return '<div style="margin-top:6px">' +
      '<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:' + color + ';margin-right:5px;vertical-align:middle"></span>' +
      '<b>' + t(tierKey) + '</b>' +
      '<div style="margin-left:15px;color:#6b7583;font-size:10.5px;line-height:1.35">' +
        t('ideamLayerHidro') + ': ' + t(hidroKey) + '<br>' +
        t('ideamLayerDesliz') + ' / ' + t('ideamLayerIncendios') + ': ' + t(muniKey) +
      '</div></div>';
  }
  el.innerHTML =
    '<div style="font-weight:600;margin-bottom:2px;max-width:170px">' + t('ideamLegendTitle') + '</div>' +
    row('#d62828', 'ideamTierHigh', 'ideamRoja', 'ideamAlta') +
    row('#f08c00', 'ideamTierMedium', 'ideamNaranja', 'ideamModerada') +
    row('#f1c40f', 'ideamTierLow', 'ideamAmarilla', 'ideamBaja');
}

function refreshIdeamI18n(){
  if (!ideamMap) return;
  renderIdeamLegend();
  ['hidro','desliz','incendios'].forEach(function(key){
    var layer = ideamGeoLayers[key];
    if (!layer) return;
    layer.eachLayer(function(l){
      var props = l.feature && l.feature.properties;
      if (!props) return;
      var html = (key === 'hidro') ? ideamHidroPopup(props, key) : ideamMuniPopup(props, key);
      l.setPopupContent(html);
    });
  });
  var emptyEl = document.getElementById('ideamEmptyMsg');
  if (emptyEl) emptyEl.textContent = t('ideamEmpty');
  var totalFeatures = ['hidro','desliz','incendios'].reduce(function(sum,k){
    return sum + ((ideamRawFeatures[k] && ideamRawFeatures[k].length) || 0);
  }, 0);
  if (emptyEl) emptyEl.style.display = (totalFeatures === 0) ? 'block' : 'none';
  var updEl = document.getElementById('ideamUpdatedAt');
  if (updEl && ideamLastRunUtc) {
    updEl.textContent = t('ideamUpdatedPrefix') + ideamLastRunUtc.replace('T',' ').replace('Z',' UTC');
  }
}

function initIdeamTab(){
  if (ideamMap) return; // ya inicializado
  var container = document.getElementById('ideamMap');
  if (!container) return;
  ideamMap = L.map('ideamMap', { center: [-1.2, -73.6], zoom: 6, scrollWheelZoom: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 18
  }).addTo(ideamMap);

  ideamLegendControl = L.control({ position: 'bottomright' });
  ideamLegendControl.onAdd = function(){
    var d = L.DomUtil.create('div', 'ideam-legend');
    L.DomEvent.disableClickPropagation(d);
    return d;
  };
  ideamLegendControl.addTo(ideamMap);
  renderIdeamLegend();

  var overlays = {};

  function loadLayer(key, url, styleFn, popupFn, labelKey){
    fetch(url).then(function(r){ return r.ok ? r.json() : { type:'FeatureCollection', features: [] }; })
      .then(function(data){
        var feats = data.features || [];
        ideamRawFeatures[key] = feats;
        var layer = L.geoJSON(data, {
          style: styleFn,
          onEachFeature: function(feature, l){ l.bindPopup(popupFn(feature.properties, key)); }
        });
        ideamGeoLayers[key] = layer;
        layer.addTo(ideamMap);
        overlays[t(labelKey)] = layer;
        if (ideamLayersControl) { ideamLayersControl.remove(); ideamLayersControl = null; }
        ideamLayersControl = L.control.layers(null, overlays, { position: 'topright', collapsed: true }).addTo(ideamMap);
        refreshIdeamI18n();
      })
      .catch(function(){ ideamRawFeatures[key] = []; refreshIdeamI18n(); });
  }

  loadLayer('hidro', 'IDEAM_Alerts/hidrologia.geojson', ideamHidroStyle, ideamHidroPopup, 'ideamLayerHidro');
  loadLayer('desliz', 'IDEAM_Alerts/deslizamientos.geojson', ideamMuniStyle, ideamMuniPopup, 'ideamLayerDesliz');
  loadLayer('incendios', 'IDEAM_Alerts/incendios.geojson', ideamMuniStyle, ideamMuniPopup, 'ideamLayerIncendios');

  fetch('IDEAM_Alerts/meta.json').then(function(r){ return r.ok ? r.json() : null; }).then(function(meta){
    if (meta && meta.last_run_utc) {
      ideamLastRunUtc = meta.last_run_utc;
      var el = document.getElementById('ideamUpdatedAt');
      if (el) el.textContent = t('ideamUpdatedPrefix') + ideamLastRunUtc.replace('T',' ').replace('Z',' UTC');
    }
  }).catch(function(){});
}

function buildLayersControl(){

  var overlays = {};
  overlays[t('layerBasin')] = basinLayer;
  overlays[t('borders')] = window.__bordersLayer;
  overlays[t('layerNews')] = newsLayer;
  overlays[t('layerFirms')] = firmsLayer;
  overlays[t('layerSst')] = sstLayer;
  layersControl = L.control.layers(baseLayers, overlays, { position: 'topright', collapsed: true }).addTo(map);
}

// Solo los limites de los 6 paises del proyecto (codigos ISO 3166-1 alpha-3),
// para no mostrar limites ni nombres de lugares del resto del mundo.
const PROJECT_ISO3 = ["BRA", "PER", "COL", "BOL", "ECU", "VEN"];

function loadBordersLayer(){
  fetch('https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json')
    .then(function(r){ return r.json(); })
    .then(function(geo){
      var filtered = {
        type: 'FeatureCollection',
        features: (geo.features || []).filter(function(f){
          return PROJECT_ISO3.indexOf(f.id) !== -1;
        })
      };
      filtered.features.forEach(function(f){ COUNTRY_FEATURES[f.id] = f; });
      L.geoJSON(filtered, {
        style: { color: '#063B6D', weight: 3, opacity: 0.9, fill: false },
        interactive: false
      }).addTo(window.__bordersLayer);
      renderCountryHighlight();
    })
    .catch(function(err){ console.error('Error cargando limites nacionales:', err); });
}

function initMap(){
  map = L.map('map', { scrollWheelZoom: true }).setView(DEFAULT_MAP_CENTER, DEFAULT_MAP_ZOOM);

  window.__osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', maxZoom: 18
  });

  window.__satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri World Imagery', maxZoom: 18
  }).addTo(map);

  // Capa vectorial (no tile) con solo los limites de los 6 paises del analisis;
  // se puebla de forma asincrona y queda vacia hasta que el GeoJSON responde.
  window.__bordersLayer = L.layerGroup();
  loadBordersLayer();

  // Pane propio para el limite de la cuenca, por debajo de noticias y FIRMS.
  map.createPane('basinPane');
  map.getPane('basinPane').style.zIndex = 350;
  map.getPane('basinPane').style.pointerEvents = 'none';
  basinLayer = L.layerGroup().addTo(map);

  map.createPane('countryHighlightPane');
  map.getPane('countryHighlightPane').style.zIndex = 360;
  map.getPane('countryHighlightPane').style.pointerEvents = 'none';
  countryHighlightLayer = L.layerGroup().addTo(map);

  newsLayer = L.layerGroup().addTo(map);
  // Canvas en vez de SVG: miles de focos de calor se dibujan mucho mas rapido.
  firmsRenderer = L.canvas({ padding: 0.5 });
  firmsLayer = L.layerGroup().addTo(map);
  map.on('overlayadd overlayremove', function(e){
    updateFirmsLegend();
    updateSstLegend();
    renderFirmsTimelineControl();
    if (e.type === 'overlayremove' && e.layer === firmsLayer) {
      stopFirmsTimelinePlay();
    }
  });
  // Activada por defecto (Progreso 3, 14-10-2026): es una capa de
  // contexto/prediccion (ENSO), no un evento dentro de la cuenca, pero se
  // deja visible desde el primer render a pedido explicito del usuario.
  sstLayer = L.layerGroup().addTo(map);

  buildLayersControl();
}

function csvEscape(v){
  if (v === null || v === undefined) return '';
  var s = String(v);
  if (/[",\n]/.test(s)) {
    s = '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function exportEventsCsv(){
  var filtered = getFiltered();
  var cols = ['id','country','hazard','priority','status','basinStatus','verification',
    'eventDate','firstDetected','lastUpdated','updateCount','lat','lon','coordAccuracy',
    'title','primarySourceUrl',
    'affectedPersons','affectedFamilies','deaths','injuries','displaced','evacuated','impactScope','impactAsOf','impactSourceUrl'];
  var rows = [cols.join(',')];
  filtered.forEach(function(e){
    var title = (e.title && (e.title[currentLang] || e.title.es)) || e.id;
    var primaryUrl = (e.sources && e.sources.length) ? e.sources[0].url : '';
    var row = [
      e.id, e.country, e.hazard, e.priority, e.status, e.basinStatus, e.verification,
      e.eventDate, e.firstDetected, e.lastUpdated, e.updateCount,
      (typeof e.lat === 'number' ? e.lat : ''), (typeof e.lon === 'number' ? e.lon : ''),
      e.coordAccuracy, title, primaryUrl
    ];
    var im = e.impact || {};
    row = row.concat([im.affectedPersons, im.affectedFamilies, im.deaths, im.injuries, im.displaced, im.evacuated, im.scope, im.asOf, im.sourceUrl]);
    rows.push(row.map(csvEscape).join(','));
  });
  var csvContent = '﻿' + rows.join('\r\n');
  var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'amazon-basin-events-' + stamp + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function closeAllMenus(){
  document.querySelectorAll('.dropdown-panel.open').forEach(function(p){ p.classList.remove('open'); });
  document.querySelectorAll('.has-submenu.open').forEach(function(p){ p.classList.remove('open'); p.setAttribute('aria-expanded','false'); });
  document.querySelectorAll('.dropdown > button[aria-expanded]').forEach(function(b){ b.setAttribute('aria-expanded','false'); });
}

function updateLangButton(){
  var lbl = document.getElementById('langBtnLabel');
  if (lbl) lbl.textContent = currentLang.toUpperCase();
  document.querySelectorAll('.lang-item').forEach(function(btn){
    btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
  });
}

function wireDropdownToggle(btn, panel){
  btn.addEventListener('click', function(ev){
    ev.stopPropagation();
    var willOpen = !panel.classList.contains('open');
    closeAllMenus();
    if (willOpen) { panel.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); }
  });
}

function wireMenus(){
  wireDropdownToggle(document.getElementById('exportMenuBtn'), document.getElementById('exportMenuPanel'));
  wireDropdownToggle(document.getElementById('langBtn'), document.getElementById('langMenuPanel'));
  var monthlyToggle = document.getElementById('monthlyReportToggle');
  var monthlyItem = document.getElementById('monthlyReportItem');
  monthlyToggle.addEventListener('click', function(ev){
    ev.stopPropagation();
    var willOpen = !monthlyItem.classList.contains('open');
    monthlyItem.classList.toggle('open', willOpen);
    monthlyItem.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  });
  document.querySelectorAll('.lang-item').forEach(function(btn){
    btn.addEventListener('click', function(){
      currentLang = btn.getAttribute('data-lang');
      applyI18nText();
      renderAll();
      updateLangButton();
      closeAllMenus();
    });
  });
  document.addEventListener('click', closeAllMenus);
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') closeAllMenus(); });
}

function wireControls(){
  wireMenus();
  document.getElementById('infoBtn').addEventListener('click', function(){
    var p = document.getElementById('infoPanel');
    p.style.display = (p.style.display === 'none' || !p.style.display) ? 'block' : 'none';
  });
  document.getElementById('dateFrom').addEventListener('change', function(e){ dateFrom = e.target.value || null; renderAll(); });
  document.getElementById('dateTo').addEventListener('change', function(e){ dateTo = e.target.value || null; renderAll(); });
  document.getElementById('dateClear').addEventListener('click', function(){
    dateFrom = null; dateTo = null;
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    renderAll();
  });
  document.getElementById('exportCsvBtn').addEventListener('click', function(){
    exportEventsCsv();
    closeAllMenus();
  });
  document.getElementById('eventFilter').addEventListener('change', function(ev){
    activeEventId = ev.target.value || null;
    renderAll();
    if (!map) return;
    var sel = activeEventId ? EVENTS.filter(function(x){ return x.id === activeEventId; })[0] : null;
    if (sel && typeof sel.lat === 'number' && typeof sel.lon === 'number') {
      map.setView([sel.lat, sel.lon], 7);
    } else {
      zoomToFilteredEvents(activeCountry ? countryZoomBounds(activeCountry) : null);
    }
  });
}

function wireTabs(){
  document.querySelectorAll('#tabs .tab-btn').forEach(function(b){
    b.addEventListener('click', function(){ showTab(b.getAttribute('data-tab')); });
  });
  if (/^#(pronostico|previsao|forecast)$/i.test(location.hash)) showTab('forecast');
  if (/^#(clima|climate)$/i.test(location.hash)) showTab('climate');
}

function initDashboard(){
  updateLangButton();
  applyI18nText();
  initMap();
  wireControls();
  wireTabs();
  renderBasinLayer();
  renderSstLayer();
  updateSstLegend();
  renderAll();
}

// "Ultima actualizacion" del Monitor combina 3 fuentes que se refrescan por
// separado y en momentos distintos: eventos (meta.json, solo cuando algo en
// Events/ cambia), focos FIRMS (firms_hotspots.json, a diario via su propia
// cabecera HTTP Last-Modified) y Alertas IDEAM (IDEAM_Alerts/meta.json, a
// diario). Antes del 29-10-2026 el panel solo mostraba meta.json, asi que la
// fecha quedaba "congelada" mas de una semana si no se tocaba ningun evento,
// aunque FIRMS/IDEAM se hubieran refrescado cada dia mientras tanto -- ahora
// se piden las 3 y se muestra la mas reciente de todas.
function parseKnownTimestamp(s){
  if (!s) return null;
  var iso = String(s).trim().replace(' UTC', 'Z').replace(' ', 'T');
  var ms = Date.parse(iso);
  if (!isNaN(ms)) return ms;
  ms = Date.parse(s); // cabecera HTTP Last-Modified u otro formato que Date() entienda
  return isNaN(ms) ? null : ms;
}
function formatUtcTimestamp(ms){
  var d = new Date(ms);
  function p2(n){ return (n < 10 ? '0' : '') + n; }
  return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()) + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ' UTC';
}
function computeLastUpdated(eventsLastUpdated, firmsLastModified, ideamLastRun){
  var candidates = [eventsLastUpdated, firmsLastModified, ideamLastRun]
    .map(parseKnownTimestamp)
    .filter(function(ms){ return ms != null; });
  if (!candidates.length) return eventsLastUpdated || '';
  return formatUtcTimestamp(Math.max.apply(null, candidates));
}

document.addEventListener('DOMContentLoaded', function(){
  Promise.all([
    fetch('./events.json').then(function(r){ return r.json(); }),
    fetch('./firms_hotspots.json').then(function(r){
      var lastModified = r.headers.get('last-modified');
      return r.json().then(function(data){ return { data: data, lastModified: lastModified }; });
    }),
    fetch('./meta.json').then(function(r){ return r.json(); }),
    // amazon_basin.geojson es el poligono real de la cuenca (Eva & Huber 2005,
    // sensu latissimo) -- tambien opcional/tolerante, para que su ausencia
    // nunca tumbe la carga del resto de los datos.
    fetch('./amazon_basin_project.geojson').then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
    // Reports/latest.json solo existe despues de la primera publicacion
    // aprobada del informe trimestral -- 404 es normal antes de eso.
    fetch('./Reports/latest.json').then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
    // IDEAM_Alerts/meta.json aporta su propio last_run_utc a computeLastUpdated
    // (ver nota arriba); tolerante a 404 igual que los demas archivos opcionales.
    fetch('./IDEAM_Alerts/meta.json').then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
    // La capa ENSO/SST (SST_GIBS_TILE_URL, arriba) ya no depende de ningun
    // archivo propio -- es una tesela publica de NASA GIBS con URL fija,
    // asi que no hace falta pedirla aqui.
  ]).then(function(results){
    // Normaliza el hazard a MAYUSCULAS_CON_GUION_BAJO para que siempre calce con
    // ICON_PATHS/HAZARD_ORDER, sin importar como venga escrito en events.json
    // (ej. "Extreme Rain" -> "EXTREME_RAIN"). Sin esto, los eventos con un
    // valor de hazard no normalizado se quedaban sin icono (usaban DEFAULT).
    EVENTS = (results[0] || []).map(function(e){
      var copy = Object.assign({}, e);
      copy.hazard = normalizeHazard(e.hazard);
      return copy;
    });
    FIRMS_HOTSPOTS = (results[1] && results[1].data) || [];
    LAST_UPDATED = computeLastUpdated(
      results[2] && results[2].lastUpdated,
      results[1] && results[1].lastModified,
      results[5] && results[5].last_run_utc
    );
    AMAZON_BASIN_GEOJSON = results[3] || null;
    LATEST_REPORT = results[4] || null;
    renderReportButton();
    initDashboard();
  }).catch(function(err){
    console.error('Error cargando datos del monitor:', err);
    EVENTS = [];
    FIRMS_HOTSPOTS = [];
    LAST_UPDATED = '';
    AMAZON_BASIN_GEOJSON = null;
    LATEST_REPORT = null;
    renderReportButton();
    initDashboard();
  });
});

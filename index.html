<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PRISMA Amazonía</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --3is-navy:#063B6D; --3is-teal-deep:#135879; --3is-cyan:#207685;
    --3is-aqua:#41C0A6; --3is-teal:#4CDBB0; --3is-gray:#E6E6E6;
    --3is-aqua-tint:#D4F5EE; --3is-peach:#FFDAB9; --3is-coral:#FD956F; --3is-mustard:#F4B942;
    --radius: 10px;
    --border: var(--3is-gray);
    --border-strong: var(--3is-cyan);
    --text-primary: #000000;
    --text-secondary: var(--3is-teal-deep);
    --text-muted: #6b7583;
    --surface-1: var(--3is-gray);
    --surface-2: #ffffff;
    --font-sans: 'Montserrat', sans-serif;
    --fill-primary: var(--3is-teal);
    --on-primary: var(--3is-navy);
  }
  #av-3is-root, #av-3is-root * { font-family: var(--font-sans); box-sizing: border-box; }
  #av-3is-root { background: #ffffff; border: 1px solid var(--3is-gray); border-radius: 16px; overflow: hidden; }
  #av-3is-body { padding: 1.5rem; }
  .firms-legend { background:#fff; padding:8px 10px; border-radius:8px; border:1px solid var(--3is-gray); font-size:11px; line-height:1.3; max-width:200px; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  .sst-legend { background:#fff; padding:8px 10px; border-radius:8px; border:1px solid var(--3is-gray); font-size:11px; line-height:1.3; max-width:260px; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  .ideam-legend { background:#fff; padding:8px 10px; border-radius:8px; border:1px solid var(--3is-gray); font-size:11px; line-height:1.3; max-width:230px; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  #map { height: 420px; border-radius: var(--radius); z-index: 0; }
  select, input[type=checkbox] { font-family: var(--font-sans); }
  select { border: 1px solid var(--3is-cyan); border-radius: var(--radius); padding: 5px 10px; font-size: 13px; color: var(--3is-teal-deep); background: #fff; }
  button#infoBtn { border: 1px solid var(--3is-cyan); border-radius: var(--radius); padding: 5px 12px; background: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
  .chip { font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--3is-cyan); background: transparent; color: var(--3is-teal-deep); cursor: pointer; }
  .chip.active { background: var(--3is-teal); color: var(--3is-navy); border-color: var(--3is-teal); font-weight: 700; }
  .leaflet-popup-content-wrapper { background: #fff; color: var(--text-primary); border-radius: 8px; font-family: var(--font-sans); border: 1px solid var(--3is-gray); }
  .leaflet-popup-tip { background: #fff; }
  .stat-card { background: var(--3is-gray); border-radius: var(--radius); padding: 1rem; }
  .stat-card p:first-child { font-size: 13px; color: var(--3is-teal-deep); margin: 0; font-weight: 500; }
  .stat-card p:last-child { font-size: 24px; font-weight: 800; margin: 4px 0 0; color: var(--3is-navy); }
  /* Pestanas tipo carpeta: la activa es blanca y se une al contenido de abajo */
  .tabs-bar { position:absolute; left:1.5rem; right:1.5rem; bottom:-6px; display:flex; align-items:flex-end; gap:4px; z-index:2; }
  .tab-btn { position:relative; font-family: var(--font-sans); font-size:14px; font-weight:600; padding:9px 24px 10px; margin-bottom:6px;
    border:none; border-radius:10px 10px 0 0; background:var(--3is-gray); color:var(--3is-navy); cursor:pointer; }
  .tab-btn:hover { background:#d7d7d7; }
  .tab-btn.active { background:#fff; color:var(--3is-navy); margin-bottom:0; padding-bottom:16px; }
  .banner-logos-row { display:flex; align-items:center; gap:16px; position:relative; top:-10px; }
  .banner-logo { height:38px; width:auto; display:block; }
  .tab-btn.active::before, .tab-btn.active::after { content:""; position:absolute; bottom:0; width:10px; height:10px; pointer-events:none; }
  .tab-btn.active::before { left:-10px; background:radial-gradient(circle at 0 0, transparent 9.5px, #fff 10px); }
  .tab-btn.active::after { right:-10px; background:radial-gradient(circle at 100% 0, transparent 9.5px, #fff 10px); }
  /* Titulo y subtitulo: ya no absolutos -- fluyen en columna junto al boton de idioma */
  #bannerTitle { text-align:right; }
  /* Menus desplegables genericos: boton Descargar (CSV/informes) y boton de idioma */
  .dropdown { position: relative; display: inline-block; }
  .dropdown-panel { display:none; position:absolute; top:calc(100% + 6px); right:0; left:auto; background:#fff; border:1px solid var(--3is-cyan); border-radius:var(--radius); box-shadow:0 6px 18px rgba(0,0,0,.18); min-width:230px; z-index:40; padding:6px; }
  .dropdown-panel.open { display:block; }
  .dropdown-item { position:relative; display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px; border:none; background:none; border-radius:8px; font-family:var(--font-sans); font-size:12px; font-weight:500; color:var(--3is-teal-deep); text-decoration:none; white-space:nowrap; cursor:pointer; text-align:left; }
  .dropdown-item:hover, .dropdown-item.active { background:var(--3is-aqua-tint); }
  .dropdown-item .submenu-caret { margin-left:auto; }
  .dropdown-submenu { display:none; position:absolute; top:-6px; right:100%; left:auto; margin-right:4px; background:#fff; border:1px solid var(--3is-cyan); border-radius:var(--radius); box-shadow:0 6px 18px rgba(0,0,0,.18); min-width:150px; padding:6px; z-index:50; }
  .has-submenu.open .dropdown-submenu { display:block; }
  @media (hover:hover) { .has-submenu:hover .dropdown-submenu { display:block; } }
  @media (max-width: 640px) {
    .dropdown-submenu { position:static; box-shadow:none; border:none; margin:2px 0 2px 18px; min-width:0; }
  }
  .toolbar-btn { display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border:1px solid var(--3is-cyan); border-radius:var(--radius); background:#fff; font-size:12px; font-weight:500; color:var(--3is-teal-deep); cursor:pointer; font-family:var(--font-sans); }
  .toolbar-btn-ghost { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border:1px solid var(--3is-cyan); border-radius:999px; background:#fff; color:var(--3is-teal-deep); font-size:12px; font-weight:500; cursor:pointer; font-family:var(--font-sans); }
  .toolbar-btn-ghost:hover { background:var(--3is-aqua-tint); }
  /* Pantallas angostas: las pestanas necesitan su propio espacio bajo el banner */
  @media (max-width: 760px) {
    .tab-btn { font-size:12px; padding:8px 10px 9px; white-space:nowrap; }
    .tab-btn.active { padding-bottom:14px; }
    .banner-logos-row { gap:10px; top:-6px; }
    .banner-logo { height:26px; }
  }
  .brand-divider { height: 6px; background: linear-gradient(90deg, var(--3is-aqua) 0%, var(--3is-cyan) 55%, var(--3is-navy) 100%); }
</style>
</head>
<body style="background:#f5f5f5;margin:0;padding:1.5rem">

<div id="av-3is-root">

<div id="banner" style="position:relative;background:#ffffff;padding:1.25rem 1.5rem 3.4rem">
  <div style="position:relative;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px">
    <div class="banner-logos-row">
    <img class="banner-logo" src="logo_cuenca.png" alt="Proyecto CUENCA — Fortalecimiento de la capacidad de respuesta en la Cuenca Amazónica">
    <img class="banner-logo" src="3is_logo.png" alt="3iS">
    <img class="banner-logo" src="echo_logo.png" alt="Financiado por la Unión Europea — Ayuda Humanitaria">
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div id="bannerTitle">
        <p style="font-weight:800;font-size:24px;line-height:1.15;margin:0;color:var(--3is-navy)" data-i18n="title"></p>
        <p id="bannerSubtitle" style="font-size:13px;line-height:1.3;font-weight:500;color:var(--3is-teal-deep);margin:3px 0 0;max-width:300px;text-align:right"></p>
      </div>
      <div class="dropdown" id="langMenu">
        <button type="button" id="langBtn" class="toolbar-btn-ghost" aria-haspopup="true" aria-expanded="false" title="Idioma / Language">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#135879" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3c2.5 2.7 4 6.1 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6.1-4-9s1.5-6.3 4-9z"/></svg>
          <span id="langBtnLabel">ES</span>
        </button>
        <div class="dropdown-panel" id="langMenuPanel" role="menu" aria-label="Idioma / Language">
          <button type="button" class="dropdown-item lang-item active" data-lang="es" role="menuitem">Español</button>
          <button type="button" class="dropdown-item lang-item" data-lang="pt" role="menuitem">Português</button>
          <button type="button" class="dropdown-item lang-item" data-lang="en" role="menuitem">English</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Pestanas tipo carpeta (estilo Chrome), apoyadas sobre el borde inferior del banner -->
  <nav id="tabs" class="tabs-bar" role="tablist">
    <button class="tab-btn active" role="tab" data-tab="monitor" data-i18n="tabMonitor"></button>
    <button class="tab-btn" role="tab" data-tab="forecast" data-i18n="tabForecast"></button>
    <button class="tab-btn" role="tab" data-tab="climate" data-i18n="tabClimate"></button>
    <button class="tab-btn" role="tab" data-tab="ideam" data-i18n="tabIdeam" style="display:none"></button>
  </nav>
</div>
<div class="brand-divider"></div>

<div id="av-3is-body">
<div id="tabMonitor">

<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
    <div id="countryFilters" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:12px;color:var(--3is-teal-deep)" data-i18n="dateFrom"></span>
        <input type="date" id="dateFrom" style="width:auto;padding:5px 8px;border:1px solid var(--3is-cyan);border-radius:var(--radius);font-size:12px;color:var(--3is-teal-deep)">
        <span style="font-size:12px;color:var(--3is-teal-deep)" data-i18n="dateTo"></span>
        <input type="date" id="dateTo" style="width:auto;padding:5px 8px;border:1px solid var(--3is-cyan);border-radius:var(--radius);font-size:12px;color:var(--3is-teal-deep)">
        <button id="dateClear" style="border:none;background:none;color:var(--3is-cyan);font-size:12px;text-decoration:underline;cursor:pointer;padding:4px" data-i18n="dateClear"></button>
      </div>
      <div class="dropdown" id="exportMenu">
        <button type="button" id="exportMenuBtn" class="toolbar-btn" aria-haspopup="true" aria-expanded="false" title="Descargar / Download">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--3is-teal-deep)" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          <span data-i18n="exportMenuBtn"></span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--3is-teal-deep)" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="dropdown-panel" id="exportMenuPanel" role="menu" aria-label="Descargar">
          <button type="button" class="dropdown-item" id="exportCsvBtn" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--3is-teal-deep)" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
            <span data-i18n="exportCsv"></span>
          </button>
          <a class="dropdown-item" id="reportBtn" href="./Reports/Informe_trimestral_vigente.pdf" target="_blank" rel="noopener" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--3is-teal-deep)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
            <span data-i18n="reportBtn"></span><span id="reportBtnPeriod" style="font-weight:400;opacity:.75"></span>
          </a>
          <div class="dropdown-item has-submenu" id="monthlyReportItem" role="menuitem" aria-haspopup="true" aria-expanded="false">
            <span id="monthlyReportToggle" style="display:flex;align-items:center;gap:8px;width:100%;cursor:pointer">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--3is-teal-deep)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
              <span data-i18n="monthlyReportBtn"></span>
              <svg class="submenu-caret" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--3is-teal-deep)" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
            </span>
            <div class="dropdown-submenu" id="monthlyReportSubmenu" role="menu" aria-label="Informe mensual por pais">
              <a class="dropdown-item" href="./Reports/Informe_mensual_bolivia_vigente.pdf" target="_blank" rel="noopener" role="menuitem" data-i18n="Bolivia"></a>
              <a class="dropdown-item" href="./Reports/Informe_mensual_brasil_vigente.pdf" target="_blank" rel="noopener" role="menuitem" data-i18n="Brazil"></a>
              <a class="dropdown-item" href="./Reports/Informe_mensual_colombia_vigente.pdf" target="_blank" rel="noopener" role="menuitem" data-i18n="Colombia"></a>
              <a class="dropdown-item" href="./Reports/Informe_mensual_ecuador_vigente.pdf" target="_blank" rel="noopener" role="menuitem" data-i18n="Ecuador"></a>
              <a class="dropdown-item" href="./Reports/Informe_mensual_peru_vigente.pdf" target="_blank" rel="noopener" role="menuitem" data-i18n="Peru"></a>
              <a class="dropdown-item" href="./Reports/Informe_mensual_venezuela_vigente.pdf" target="_blank" rel="noopener" role="menuitem" data-i18n="Venezuela"></a>
            </div>
          </div>
        </div>
      </div>
      <button id="infoBtn" title="Info" style="display:inline-flex;align-items:center;padding:7px 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--3is-navy)" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.5" r="1" fill="var(--3is-navy)" stroke="none"/></svg></button>
    </div>
</div>

<div id="eventFilterRow" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
  <span style="font-size:12px;color:var(--3is-teal-deep);font-weight:600" data-i18n="eventFilter"></span>
  <select id="eventFilter" style="flex:1;min-width:220px;max-width:640px;padding:5px 8px;border:1px solid var(--3is-cyan);border-radius:var(--radius);font-size:12px;color:var(--3is-teal-deep);background:#fff"></select>
</div>

<div id="infoPanel" style="display:none;background:var(--3is-aqua-tint);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1rem;font-size:13px;color:var(--3is-teal-deep);line-height:1.6"></div>

<div id="alertBanner" style="display:none;align-items:center;gap:10px;background:#FDECEA;border:1px solid #E24B4A;border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:#8A1F1F;font-weight:600"></div>

<div id="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:1.25rem"></div>

<!-- Progreso 1: KPI de poblacion afectada reportada (suma dinamica segun filtros) -->
<div id="impactSection" style="border:1px solid var(--3is-gray);border-radius:var(--radius);padding:1rem;margin-bottom:1.25rem;background:#fff">
  <p style="font-weight:700;font-size:14px;color:var(--3is-navy);margin:0 0 10px" data-i18n="impactTitle"></p>
  <div id="impactKpis" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px"></div>
  <p style="font-size:11px;color:var(--text-muted);margin:8px 0 0" data-i18n="impactNote"></p>
  <details id="impactDetailWrap" style="margin-top:8px;font-size:12px">
    <summary id="impactDetailSummary" style="cursor:pointer;color:var(--3is-teal-deep);font-weight:600"></summary>
    <div id="impactTable" style="overflow-x:auto;margin-top:8px"></div>
  </details>
</div>

<div style="display:flex;gap:1.25rem;align-items:stretch;flex-wrap:wrap">
  <div style="flex:2;min-width:320px">
    <div id="map"></div>
    <div id="firmsTimeline" style="display:none;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;background:var(--3is-aqua-tint);border-radius:var(--radius)"></div>
    <div id="legend" style="display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:12px;color:var(--3is-teal-deep)"></div>
    <p style="font-size:12px;color:var(--text-muted);margin:10px 0 0" data-i18n="mapNote"></p>
    <p style="font-size:12px;color:var(--text-muted);margin:2px 0 0" data-i18n="bordersNote"></p>
    <p style="font-size:12px;color:var(--text-muted);margin:2px 0 0" data-i18n="sstNote"></p>
    <p id="dataSources" style="font-size:12px;color:var(--text-muted);margin:8px 0 0"></p>
    <p id="lastUpdated" style="font-size:12px;color:var(--text-muted);margin:2px 0 0;font-weight:500"></p>
    <p id="progressTag" style="font-size:11px;color:var(--text-muted);margin:2px 0 0" data-i18n="progressTag"></p>
  </div>
  <div style="flex:1;min-width:260px;display:flex;flex-direction:column;border:1px solid var(--3is-gray);border-radius:var(--radius);padding:1rem;background:#fafafa">
    <p style="font-weight:700;font-size:14px;color:var(--3is-navy);margin:0 0 10px" data-i18n="alertsPanel"></p>
    <div id="filters" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"></div>
    <div id="list" style="overflow-y:auto;max-height:420px"></div>
  </div>
</div>

</div><!-- /tabMonitor -->

<div id="tabForecast" hidden>
<!-- Pronostico meteorologico: widget embebido gratuito de Windy.com (iframe).
     Es un mapa independiente del mapa principal (no comparte capas). -->
<div id="forecastSection" style="border:1px solid var(--3is-gray);border-radius:var(--radius);padding:1rem;background:#fafafa">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
    <p style="font-weight:700;font-size:14px;color:var(--3is-navy);margin:0" data-i18n="fcTitle"></p>
    <div id="forecastLayers" style="display:flex;flex-wrap:wrap;gap:8px"></div>
  </div>
  <iframe id="windyFrame" title="Windy forecast" loading="lazy" style="width:100%;height:calc(100vh - 290px);min-height:540px;border:0;border-radius:var(--radius);display:block;background:#e6e6e6" allowfullscreen></iframe>
  <p style="font-size:12px;color:var(--text-muted);margin:8px 0 0" data-i18n="fcNote"></p>
  <p style="font-size:12px;color:var(--text-muted);margin:2px 0 0" data-i18n="fcCredit"></p>
</div>
</div><!-- /tabForecast -->

<!-- Progreso 2: Monitoreo climatico. Tablero Power BI publicado en la web,
     embebido por iframe (provisional). PENDIENTE: integrarlo de forma nativa
     en el visor (ver PROGRESOS.md). El src se asigna al abrir la pestana por
     primera vez, para no cargar Power BI si nadie la usa. -->
<div id="tabClimate" hidden>
<div id="climateSection" style="border:1px solid var(--3is-gray);border-radius:var(--radius);padding:1rem;background:#fafafa">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
    <p style="font-weight:700;font-size:14px;color:var(--3is-navy);margin:0" data-i18n="climateTitle"></p>
    <a id="climateOpen" href="https://app.powerbi.com/view?r=eyJrIjoiZGEwZDFkZDQtZmZlMS00Y2Q0LWFmODgtZGMzN2NkOTBkYjMzIiwidCI6IjNlOTQyYWU0LWNkOTMtNGQzNy1iZTJmLTY5MzllNDNjMTRiNyJ9" target="_blank" rel="noopener" style="font-size:12px;color:var(--3is-cyan)" data-i18n="climateOpen"></a>
  </div>
  <iframe id="climateFrame" title="Monitoreo climático (Power BI)" data-src="https://app.powerbi.com/view?r=eyJrIjoiZGEwZDFkZDQtZmZlMS00Y2Q0LWFmODgtZGMzN2NkOTBkYjMzIiwidCI6IjNlOTQyYWU0LWNkOTMtNGQzNy1iZTJmLTY5MzllNDNjMTRiNyJ9" style="width:100%;height:calc(100vh - 290px);min-height:600px;border:0;border-radius:var(--radius);display:block;background:#e6e6e6" allowfullscreen></iframe>
  <p style="font-size:12px;color:var(--text-muted);margin:8px 0 0" data-i18n="climateNote"></p>
</div>
</div><!-- /tabClimate -->
<!-- Progreso 6: Alertas IDEAM. Capa de alerta temprana (hidrologia,

l:"Detalle por evento", eventFilter:"Evento", allEvents:"Todos los eventos", impactLbl:"Afectados reportados", persons:"personas", families:"familias", deathsLbl:"fallecidos", injuredLbl:"heridos", displacedLbl:"desplazados", evacuatedLbl:"evacuados", partial:"parcial", noImpact:"Sin cifras reportadas en la selección actual.", eventsWithFig:"eventos con cifra", colEvent:"Evento", colPlace:"País · tipo", colAsOf:"Fecha cifra", colSource:"Fuente", progressTag:"KPI de población afectada reportada, filtrable por país, tipo de evento y evento.", title:"PRISMA Amazonía", subtitleFull:"Plataforma Regional de Inteligencia y Seguimiento Multiamenaza Amazónica", subtitleMonitor:"Eventos activos por amenaza y prioridad", subtitleForecast:"Precipitación, temperatura, radar y tormentas eléctricas", subtitleClimate:"Indicadores y tendencias climáticas estacionales", subtitleIdeam:"Alertas oficiales de IDEAM para la porción colombiana de la cuenca", mapNote:"Mapa base OpenStreetMap. Datos: base propia de eventos verificados (ver lista a la derecha).",

    sstNote:"Capa ENSO: anomalía de temperatura superficial del mar (NASA GIBS, producto GHRSST L4 MUR — la misma imagen de NASA Worldview) en el Pacífico ecuatorial, con las regiones de referencia Niño 1+2, 3, 3.4 y 4. Es un indicador predictivo de sequías/inundaciones en la cuenca amazónica, no un evento dentro de la cuenca — por eso puede requerir alejar el mapa hacia el Pacífico para verse. Se actualiza con 1-2 días de rezago típico.",
    infoHTML:`<p style="margin:0 0 8px"><b style="color:var(--3is-navy)">PRISMA Amazonía</b></p><p style="margin:0 0 12px">Plataforma Regional de Inteligencia y Seguimiento Multiamenaza Amazónica. Contenido por pestaña: <b>Monitor de eventos</b> — eventos activos por amenaza y prioridad; <b>Pronóstico</b> — precipitación, temperatura, radar y tormentas eléctricas; <b>Análisis climático</b> — indicadores y tendencias climáticas estacionales; <b>Alertas IDEAM</b> — alertas oficiales de IDEAM para la porción colombiana de la cuenca (visible solo al filtrar por Colombia).</p><p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Niveles de alerta</b></p>
      <p style="margin:0 0 4px"><span style="color:#E24B4A">● Rojo</span>: impacto real confirmado y significativo (“Take action”).</p>
      <p style="margin:0 0 4px"><span style="color:#EF9F27">● Naranja</span>: impacto real reportado, pero no al nivel de Rojo (“Be prepared”).</p>
      <p style="margin:0 0 4px"><span style="color:#E8C547">● Amarillo</span>: evento activo/vigente sin impacto real confirmado todavía (“Be aware”).</p>
      <p style="margin:0 0 8px"><span style="color:#639922">● Verde</span>: sin impacto real reportado y el evento ya está cerrado, o es de severidad mínima (“No severe hazard expected”).</p>
      <p style="margin:0 0 12px">Niveles según la matriz Likelihood × Impact de las <i>WMO Guidelines on Multi-hazard Impact-based Forecast and Warning Services</i> (WMO-No. 1150, 2015), el estándar que UNDRR promueve vía Early Warnings for All y el Common Alerting Protocol (no es el Marco de Sendai). Nunca se copia el color de alerta que use la fuente original.</p>
      <p style="margin:0 0 12px">Los eventos activos se re-verifican periódicamente según el tipo de amenaza (3-7 días para pronósticos, 7-10 para incendios, 7-14 para lluvias/inundaciones, 14-30 para inundaciones de río/deslizamientos, 30-60 para sequía/deforestación). El visor muestra siempre todos los eventos activos, sin límite de antigüedad; los eventos cerrados (ENDED) se conservan visibles 90 días.</p>
      <p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Metodología y fuentes</b></p>
      <p style="margin:0 0 4px">Jerarquía de fuentes: Nivel 1 (GDACS, USGS, WMO, NASA, Copernicus, FAO, OCHA, ReliefWeb, servicios meteorológicos/geológicos nacionales) → Nivel 2 (WFP, IFRC, Cruz Roja) → Nivel 3 (medios acreditados) → Nivel 4 (redes sociales, solo como pista, nunca confirmación única).</p>
      <p style="margin:0 0 4px">Cada evento requiere verificación cruzada cuando es posible (idealmente fuente oficial + humanitaria, o fuente oficial + medio acreditado). Si solo hay una fuente confiable: <code>SINGLE_SOURCE</code>. Si las fuentes se contradicen: <code>CONFLICTING_INFORMATION</code>.</p>
      <p style="margin:0 0 4px">Los focos de calor satelitales (FIRMS) que se muestran en el mapa cubren los últimos 7 días; para el histórico completo, consulta la <a href="https://firms.modaps.eosdis.nasa.gov/download/" target="_blank" style="color:var(--3is-cyan)">herramienta de descarga histórica de NASA FIRMS ↗</a>.</p>
      <p style="margin:0 0 4px">Coordenadas en WGS84 (EPSG:4326). La cobertura geográfica se limita a Bolivia, Brasil, Colombia, Ecuador, Perú y Venezuela; un evento dentro de un país elegible no se incluye automáticamente si ocurre fuera de la cuenca amazónica.</p>
      <p style="margin:0">El límite oficial de la cuenca (capa de la Panamazonía, incluyendo el estuario, sin Guyana, Surinam ni Guayana Francesa, que no forman parte del proyecto) se usa como la única zona de verdad: los eventos y los focos de calor (FIRMS) con coordenadas fuera de ese límite se excluyen del mapa y del listado, aunque queden dentro del rectángulo geográfico de búsqueda. La capa ENSO/TSM (Pacífico) es un indicador predictivo externo y no se recorta a este límite.</p>
      <p style="margin:8px 0 0"><a href="https://gdacs.org/" target="_blank" style="color:var(--3is-cyan)">GDACS ↗</a> · <a href="https://reliefweb.int/" target="_blank" style="color:var(--3is-cyan)">ReliefWeb ↗</a> · <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" style="color:var(--3is-cyan)">NASA FIRMS ↗</a></p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Población afectada reportada</b></p><p style="margin:4px 0 4px">El panel suma, para los eventos visibles según los filtros activos (país, tipo de evento, evento, fechas y alertas rojas), las cifras de impacto <b>reportadas</b> por fuentes oficiales o medios citados: personas y familias afectadas, fallecidos, heridos, desplazados y evacuados.</p><p style="margin:0 0 4px">Reglas: (1) se toma la última cifra vigente de cada evento, sin acumular actualizaciones; (2) no se incluyen proyecciones, estimaciones ni cálculos propios; (3) familias y personas se suman por separado, sin conversión; (4) <b>*</b> indica que el total incluye cifras parciales (que cubren solo parte del área del evento); (5) "Eventos con cifras" muestra cuántos eventos de la selección tienen al menos una cifra reportada.</p><p style="margin:0 0 4px">Limitación: eventos distintos en un mismo territorio (p. ej. sequía e incendios en el mismo estado) pueden contar a la misma población; aún no se corrige ese solapamiento. Las cifras de población expuesta estimada (p. ej. con WorldPop) son un desarrollo futuro.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Monitoreo climático</b></p><p style="margin:4px 0 4px">La pestaña "Monitoreo climático" muestra un tablero de Power BI embebido, de forma provisional. Está previsto integrarlo de forma nativa en este visor (mismos filtros, idiomas y límite de la cuenca).</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Anomalía SST / ENSO</b></p><p style="margin:4px 0 4px">La capa "Anomalía SST (ENSO)" usa ahora directamente la tesela pública y oficial de <b>NASA GIBS</b> (producto GHRSST L4 MUR, la misma imagen que muestra NASA Worldview), en vez de calcularse a diario con Google Earth Engine. Queda <b>activada por defecto</b> y tiene su propia leyenda de colores (esquina inferior derecha del mapa) con la escala oficial de NASA. La imagen se actualiza con 1-2 días de rezago típico, suficiente para un indicador de evolución lenta como ENSO. El código del cálculo anterior vía Earth Engine se conserva, sin usarse, en <code>legacy/enso_gee_pipeline/</code> del repositorio, como registro de lo hecho.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Informe situacional regional</b></p><p style="margin:4px 0 4px">El boton "Informe trimestral" descarga el ultimo Informe Situacional Regional (PDF) aprobado, que resume el trimestre para los 6 paises del proyecto: eventos del periodo, impacto reportado, relevancia para Accion Anticipatoria por sector y recomendaciones, con revision humana obligatoria antes de publicarse. El informe actualmente disponible corresponde al trimestre 2026-Q3 (1 ago - 30 sep 2026), publicado el 26-10-2026 (última actualización: 28-10-2026).</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Menu de descargas e informe mensual por pais</b></p><p style="margin:4px 0 4px">Los botones "Exportar CSV" e "Informe trimestral" se unificaron en un unico menu desplegable "Descargar", que ademas incluye "Informe mensual por pais" con un submenu para elegir el pais. Los enlaces de informe mensual apuntan a una ruta fija por pais (<code>Reports/Informe_mensual_&lt;pais&gt;_vigente.pdf</code>) que todavia no existe -- descargaran error 404 hasta que se publique el primer informe mensual, comportamiento esperado, igual que paso con el informe trimestral antes de su primera publicacion.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Alertas IDEAM</b></p><p style="margin:4px 0 0">Pestana "Alertas IDEAM - Colombia" con mapa propio que integra las 3 capas publicas de IDEAM (hidrologia, deslizamientos e incendios), filtradas al area de la cuenca amazonica colombiana (Amazonas, Caqueta, Putumayo). Son indices de amenaza/alerta temprana (ALTA/MODERADA/BAJA o alertas hidrologicas vigentes), no eventos confirmados: por eso no se incorporan a Events/ ni reciben Event_ID, y no acumulan historial propio -- cada actualizacion diaria reemplaza la anterior. La capa de hidrologia puede aparecer vacia en dias sin alerta vigente en la cuenca amazonica; esto es normal, no un error. La pestana solo aparece cuando el filtro de pais del Monitor esta en Colombia (IDEAM solo cubre Colombia). Los popups del mapa indican de cual de las 3 capas se trata (hidrologia, deslizamientos o incendios), y la leyenda unifica el color con un nivel de severidad comun (Alto/Medio/Bajo), mostrando debajo el termino nativo de IDEAM para cada capa -- p. ej. "Alerta Roja" en hidrologia equivale a "Amenaza Alta" en deslizamientos/incendios. La nota de fuente ya no menciona "sin autenticacion" (dato irrelevante para el usuario); solo dice "datos publicos". Actualizacion automatica diaria desde los datos oficiales de IDEAM.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Historial de versiones</b></p><p style="margin:4px 0 0">13-10-2026: KPI de poblacion afectada reportada, filtrable por pais, tipo de evento y evento. 13-10-2026: pestana de Monitoreo climatico (provisional). 14-10-2026: la capa ENSO/SST pasa a usar directamente la tesela oficial de NASA GIBS (antes Google Earth Engine), activada por defecto con leyenda propia. 21-10-2026: boton de descarga del Informe Situacional Regional trimestral (PDF), con generacion de datos determinista y narrativa analitica revisada por un humano antes de publicarse. 22-10-2026: menu desplegable "Descargar" que agrupa el CSV de eventos, el informe trimestral y el nuevo informe mensual por pais (enlace fijo por pais, aun sin generar); se corrige tambien la superposicion del selector de idioma sobre el titulo del banner en anchos intermedios, reemplazado por un boton/icono de idioma. 27-10-2026: nueva pestana "Alertas IDEAM" con las 3 capas de alerta temprana de IDEAM para la cuenca amazonica colombiana. 29-10-2026: "Ultima actualizacion" ahora refleja la mas reciente entre eventos, focos FIRMS y Alertas IDEAM (antes solo marcaba el ultimo evento editado, lo que podia quedar varios dias desactualizada). 06-11-2026: ALERT_PRIORITY pasa a 4 niveles (RED/ORANGE/YELLOW/GREEN, WMO-1150); titulo renombrado a "Observatorio de Riesgos"; subtitulo del banner dinamico por pestana; logos subidos 10px. 13-11-2026: renombrado a "PRISMA Amazonia" (Plataforma Regional de Inteligencia y Seguimiento Multiamenaza Amazonica); fondo del banner pasa de degradado a blanco; se agrega el logo del proyecto CUENCA junto a los de 3iS y la Union Europea; el subtitulo del banner deja de variar por pestana y muestra siempre el nombre completo (el contenido por pestana se traslado al panel "Acerca de"); la barra de pestanas pasa a su propia fila debajo de los logos.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Alcance del proyecto</b></p>
      <p style="margin:4px 0 0">Este monitor apoya "Strengthening Response Capacity in the Amazon Basin", financiado por la Comisión Europea (DG ECHO), implementado del 01/06/2026 al 31/05/2028 por un consorcio liderado por Diakonie Katastrophenhilfe (DKH) junto con World Vision, 3iS y PREDES. Cobertura: Bolivia, Brasil, Colombia, Ecuador, Perú y Venezuela.</p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88;font-size:11px;font-weight:700;text-align:center">Desarrollado por:</p>
      <p style="margin:4px 0 0;font-size:11px;text-align:center;line-height:1.8">Jerson ACHICANOY<br>Information Management and GIS Expert<br>3iS<br><a href="mailto:jachicanoy@3is.org" style="color:var(--3is-cyan)">jachicanoy@3is.org</a></p>` },

    dataSourcesHTML:`Fontes de dados: <a href="https://www.openstreetmap.org/copyright" target="_blank" style="color:var(--3is-cyan)">OpenStreetMap</a> · <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" style="color:var(--3is-cyan)">NASA FIRMS</a> (focos de calor VIIRS)`,
    bordersNote:"Os dados geográficos, nomes e limites políticos e administrativos utilizados neste mapa não implicam aceitação oficial por parte da 3iS.",
    layerSst:"Anomalia de TSM (ENSO)", layerBasin:"Limite da bacia amazônica", fcTitle:"Previsão meteorológica", tabMonitor:"Monitor de eventos", tabForecast:"Previsão", fcRain:"Precipitação", fcTemp:"Temperatura", fcRadar:"Radar meteorológico", fcRainAccu:"Chuva acumulada", fcThunder:"Tempestades elétricas", fcNote:"Mapa interativo independente (não inclui o limite do projeto nem os eventos). Use a linha do tempo inferior para avançar a previsão. Na Amazônia há muito poucos radares, por isso a camada de radar aparecerá quase vazia.", fcCredit:"Previsão: Windy.com (widget incorporado gratuito, modelo ECMWF).", firmsLegend:"Focos de calor — potência radiativa (FRP, MW)", firmsLegendNote:"Células agregadas: FRP total da célula. Pontos sem FRP: classe pela confiança.", firmsCell:"focos na célula", firmsFrp:"FRP", firmsNoFrp:"sem FRP (classe pela confiança)", firms24h:"Últimas 24 h de dados", firmsUpTo:"até", firmsRange:"Datas selecionadas", firmsNone:"Sem focos nessas datas (o mapa guarda apenas os últimos 7 dias).", eventDateLbl:"Evento", updatedLbl:"Atual.",
    sstNote:"Camada ENSO: anomalia da temperatura da superfície do mar (NASA GIBS, produto GHRSST L4 MUR — a mesma imagem do NASA Worldview) no Pacífico equatorial, com as regiões de referência Niño 1+2, 3, 3.4 e 4. É um indicador preditivo de secas/inundações na bacia amazônica, não um evento dentro da bacia — por isso pode ser necessário afastar o mapa em direção ao Pacífico para vê-la. É atualizada com uma defasagem típica de 1-2 dias.",
    infoHTML:`<p style="margin:0 0 8px"><b style="color:var(--3is-navy)">PRISMA Amazonía</b></p><p style="margin:0 0 12px">Plataforma Regional de Inteligência e Monitoramento Multiameaça da Amazônia. Conteúdo por aba: <b>Monitor de eventos</b> — eventos ativos por perigo e prioridade; <b>Previsão</b> — precipitação, temperatura, radar e tempestades elétricas; <b>Análise climática</b> — indicadores e tendências climáticas sazonais; <b>Alertas IDEAM</b> — alertas oficiais do IDEAM para a porção colombiana da bacia (visível apenas ao filtrar por Colômbia).</p><p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Níveis de alerta</b></p>
      <p style="margin:0 0 4px"><span style="color:#E24B4A">● Vermelho</span>: impacto real confirmado e significativo (“Take action”).</p>
      <p style="margin:0 0 4px"><span style="color:#EF9F27">● Laranja</span>: impacto real reportado, mas não no nível de Vermelho (“Be prepared”).</p>
      <p style="margin:0 0 4px"><span style="color:#E8C547">● Amarelo</span>: evento ativo/vigente sem impacto real confirmado ainda (“Be aware”).</p>
      <p style="margin:0 0 8px"><span style="color:#639922">● Verde</span>: sem impacto real reportado e o evento já está encerrado, ou é de severidade mínima (“No severe hazard expected”).</p>
      <p style="margin:0 0 12px">Níveis conforme a matriz Likelihood × Impact das <i>WMO Guidelines on Multi-hazard Impact-based Forecast and Warning Services</i> (WMO-No. 1150, 2015), o padrão que a UNDRR promove via Early Warnings for All e o Common Alerting Protocol (não é o Marco de Sendai). Nunca se copia a cor de alerta usada pela fonte original.</p>
      <p style="margin:0 0 12px">Os eventos ativos são reverificados periodicamente conforme o tipo de ameaça (3-7 dias para previsões, 7-10 para incêndios, 7-14 para chuvas/inundações, 14-30 para cheias de rio/deslizamentos, 30-60 para seca/desmatamento). O visualizador sempre mostra todos os eventos ativos, sem limite de idade; os eventos encerrados (ENDED) permanecem visíveis por 90 dias.</p>
      <p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Metodologia e fontes</b></p>
      <p style="margin:0 0 4px">Hierarquia de fontes: Nível 1 (GDACS, USGS, WMO, NASA, Copernicus, FAO, OCHA, ReliefWeb, serviços meteorológicos/geológicos nacionais) → Nível 2 (WFP, IFRC, Cruz Vermelha) → Nível 3 (mídia credenciada) → Nível 4 (redes sociais, apenas como pista, nunca confirmação única).</p>
      <p style="margin:0 0 4px">Cada evento exige verificação cruzada quando possível (idealmente fonte oficial + humanitária, ou fonte oficial + mídia credenciada). Se houver apenas uma fonte confiável: <code>SINGLE_SOURCE</code>. Se as fontes se contradizem: <code>CONFLICTING_INFORMATION</code>.</p>
      <p style="margin:0 0 4px">Os focos de calor por satélite (FIRMS) exibidos no mapa cobrem os últimos 7 dias; para o histórico completo, consulte a <a href="https://firms.modaps.eosdis.nasa.gov/download/" target="_blank" style="color:var(--3is-cyan)">ferramenta de download histórico da NASA FIRMS ↗</a>.</p>
      <p style="margin:0 0 4px">Coordenadas em WGS84 (EPSG:4326). A cobertura geográfica se limita à Bolívia, Brasil, Colômbia, Equador, Peru e Venezuela; um evento dentro de um país elegível não é incluído automaticamente se ocorrer fora da bacia amazônica.</p>
      <p style="margin:0">O limite oficial da bacia (camada da Panamazônia, incluindo o estuário, sem Guiana, Suriname e Guiana Francesa, que não fazem parte do projeto) é usado como a única zona de verdade: eventos e focos de calor (FIRMS) com coordenadas fora desse limite são excluídos do mapa e da lista, mesmo que fiquem dentro do retângulo geográfico de busca. A camada ENSO/TSM (Pacífico) é um indicador preditivo externo e não é recortada por esse limite.</p>
      <p style="margin:8px 0 0"><a href="https://gdacs.org/" target="_blank" style="color:var(--3is-cyan)">GDACS ↗</a> · <a href="https://reliefweb.int/" target="_blank" style="color:var(--3is-cyan)">ReliefWeb ↗</a> · <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" style="color:var(--3is-cyan)">NASA FIRMS ↗</a></p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">População afetada reportada</b></p><p style="margin:4px 0 4px">O painel soma, para os eventos visíveis segundo os filtros ativos (país, tipo de evento, evento, datas e alertas vermelhos), os números de impacto <b>reportados</b> por fontes oficiais ou veículos citados: pessoas e famílias afetadas, óbitos, feridos, deslocados e evacuados.</p><p style="margin:0 0 4px">Regras: (1) usa-se o último número vigente de cada evento, sem acumular atualizações; (2) não se incluem projeções, estimativas nem cálculos próprios; (3) famílias e pessoas são somadas separadamente, sem conversão; (4) <b>*</b> indica que o total inclui números parciais (que cobrem só parte da área do evento); (5) "Eventos com números" mostra quantos eventos da seleção têm pelo menos um número reportado.</p><p style="margin:0 0 4px">Limitação: eventos diferentes no mesmo território (p. ex. seca e incêndios no mesmo estado) podem contar a mesma população; essa sobreposição ainda não é corrigida. A população exposta estimada (p. ex. com WorldPop) é um desenvolvimento futuro.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Monitoramento climático</b></p><p style="margin:4px 0 4px">A aba "Monitoramento climático" mostra um painel do Power BI incorporado, de forma provisória. Está prevista sua integração nativa a este visualizador (mesmos filtros, idiomas e limite da bacia).</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Anomalia de TSM / ENSO</b></p><p style="margin:4px 0 4px">A camada "Anomalia de TSM (ENSO)" agora usa diretamente a tesela pública e oficial da <b>NASA GIBS</b> (produto GHRSST L4 MUR, a mesma imagem exibida no NASA Worldview), em vez de ser calculada diariamente via Google Earth Engine. Ela fica <b>ativada por padrão</b> e tem sua própria legenda de cores (canto inferior direito do mapa) com a escala oficial da NASA. A imagem é atualizada com 1-2 dias de defasagem típica, suficiente para um indicador de evolução lenta como o ENSO. O código do cálculo anterior via Earth Engine foi mantido, sem uso, em <code>legacy/enso_gee_pipeline/</code> do repositório, como registro do que foi feito.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Relatorio situacional regional</b></p><p style="margin:4px 0 4px">O botao "Relatorio trimestral" baixa o ultimo Relatorio Situacional Regional (PDF) aprovado, que resume o periodo para os 6 paises do projeto: eventos do periodo, impacto reportado, relevancia para Acao Antecipatoria por setor e recomendacoes, com revisao humana obrigatoria antes da publicacao. O relatorio atualmente disponivel corresponde ao trimestre 2026-Q3 (1 ago - 30 set 2026), publicado em 26-10-2026 (última atualização: 28-10-2026).</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Menu de downloads e relatorio mensal por pais</b></p><p style="margin:4px 0 4px">Os botoes "Exportar CSV" e "Relatorio trimestral" foram unificados em um unico menu suspenso "Baixar", que tambem inclui "Relatorio mensal por pais" com um submenu para escolher o pais. Os links de relatorio mensal apontam para um caminho fixo por pais (<code>Reports/Informe_mensual_&lt;pais&gt;_vigente.pdf</code>) que ainda nao existe -- resultarao em erro 404 ate que o primeiro relatorio mensal seja publicado, comportamento esperado, assim como ocorreu com o relatorio trimestral antes de sua primeira publicacao.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Alertas IDEAM</b></p><p style="margin:4px 0 0">Aba "Alertas IDEAM - Colombia" com mapa proprio que integra as 3 camadas publicas do IDEAM (hidrologia, deslizamentos e incendios), filtradas a area da bacia amazonica colombiana (Amazonas, Caqueta, Putumayo). Sao indices de ameaca/alerta precoce (ALTA/MODERADA/BAIXA ou alertas hidrologicos vigentes), nao eventos confirmados: por isso nao sao incorporados a Events/ nem recebem Event_ID, e nao acumulam historico proprio -- cada atualizacao diaria substitui a anterior. A camada de hidrologia pode aparecer vazia em dias sem alerta vigente na bacia amazonica; isso e normal, nao um erro. A aba so aparece quando o filtro de pais do Monitor esta em Colombia (o IDEAM so cobre a Colombia). Os popups do mapa indicam a qual das 3 camadas pertence o registro (hidrologia, deslizamentos ou incendios), e a legenda unifica a cor com um nivel de severidade comum (Alto/Medio/Baixo), mostrando abaixo o termo nativo do IDEAM de cada camada -- p. ex. "Alerta Vermelha" em hidrologia equivale a "Ameaca Alta" em deslizamentos/incendios. A nota de fonte deixou de mencionar "sem autenticacao" (dado irrelevante para o usuario); agora diz apenas "dados publicos". Atualizacao automatica diaria a partir dos dados oficiais do IDEAM.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Histórico de versões</b></p><p style="margin:4px 0 0">13-10-2026: KPI de populacao afetada reportada, filtravel por pais, tipo de evento e evento. 13-10-2026: aba de Monitoramento climatico (provisoria). 14-10-2026: a camada ENSO/TSM passa a usar diretamente a tesela oficial da NASA GIBS (antes Google Earth Engine), ativada por padrao com legenda propria. 21-10-2026: botao de download do Relatorio Situacional Regional trimestral (PDF), com geracao de dados deterministica e narrativa analitica revisada por um humano antes da publicacao. 22-10-2026: menu suspenso "Baixar" que agrupa o CSV de eventos, o relatorio trimestral e o novo relatorio mensal por pais (link fixo por pais, ainda sem gerar); tambem corrige a sobreposicao do seletor de idioma sobre o titulo do banner em larguras intermediarias, substituido por um botao/icone de idioma. 27-10-2026: nova aba "Alertas IDEAM" com as 3 camadas de alerta precoce do IDEAM para a bacia amazonica colombiana. 29-10-2026: "Ultima atualizacao" agora reflete a mais recente entre eventos, focos FIRMS e Alertas IDEAM (antes so marcava o ultimo evento editado, podendo ficar varios dias desatualizada). 06-11-2026: ALERT_PRIORITY passa a 4 niveis (RED/ORANGE/YELLOW/GREEN, WMO-1150); titulo renomeado para "Observatorio de Riscos"; subtitulo do banner dinamico por aba; logos subidos 10px. 13-11-2026: renomeado para "PRISMA Amazonia" (Plataforma Regional de Inteligencia e Monitoramento Multiameaca da Amazonia); fundo do banner passa de degrade para branco; adicionado o logo do projeto CUENCA junto aos da 3iS e da Uniao Europeia; o subtitulo do banner deixa de variar por aba e passa a mostrar sempre o nome completo (o conteudo por aba foi movido para o painel "Sobre"); a barra de abas passa a ter sua propria linha abaixo dos logos.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Alcance do projeto</b></p>
      <p style="margin:4px 0 0">Este monitor apoia o "Strengthening Response Capacity in the Amazon Basin", financiado pela Comissão Europeia (DG ECHO), implementado de 01/06/2026 a 31/05/2028 por um consórcio liderado pela Diakonie Katastrophenhilfe (DKH), junto com World Vision, 3iS e PREDES. Cobertura: Bolívia, Brasil, Colômbia, Equador, Peru e Venezuela.</p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88;font-size:11px;font-weight:700;text-align:center">Desenvolvido por:</p>
      <p style="margin:4px 0 0;font-size:11px;text-align:center;line-height:1.8">Jerson ACHICANOY<br>Information Management and GIS Expert<br>3iS<br><a href="mailto:jachicanoy@3is.org" style="color:var(--3is-cyan)">jachicanoy@3is.org</a></p>` },
  en: { tabIdeam:"IDEAM Alerts", ideamTitle:"IDEAM Alerts — Colombia", ideamNote:"Early-warning layer from IDEAM, the Colombian Institute of Hydrology, Meteorology and Environmental Studies: hazard indices for hydrology, landslides and wildfires, filtered to the Colombian portion of the basin (Amazonas, Caquetá, Putumayo). These are not confirmed events in this monitor \u2014 refreshed daily, with no accumulated history.", ideamEmpty:"No active alerts today in any of the 3 layers, for the Colombian portion of the basin.", ideamSourceNote:"Source: IDEAM (bart.ideam.gov.co), public data. Municipal boundaries: IGAC / Ministry of Environment.", ideamLegendHidro:"Hydrology (sub-basins)", ideamLegendMunicipio:"Landslides / Wildfires (municipalities)", ideamAmarilla:"Yellow", ideamNaranja:"Orange", ideamRoja:"Red", ideamAlta:"High", ideamModerada:"Moderate", ideamBaja:"Low", ideamTierHigh:"High", ideamTierMedium:"Medium", ideamTierLow:"Low", ideamLegendTitle:"Alert level (same color across all 3 layers)", ideamUpdatedPrefix:"Updated: ", ideamPopupDate:"Date", ideamPopupSource:"Source", ideamLayerHidro:"Hydrology", ideamLayerDesliz:"Landslides", ideamLayerIncendios:"Wildfires", tabClimate:"Climate analysis", climateTitle:"Climate monitoring", climateOpen:"Open full screen ↗", climateNote:"Embedded Power BI dashboard (interim version). It will be integrated natively into this viewer in a future release.", impactTitle:"Reported affected population", kpiPersons:"People affected", kpiFamilies:"Families affected", kpiDeaths:"Deaths", kpiInjuries:"Injured", kpiDisplaced:"Displaced", kpiEvacuated:"Evacuated", kpiCoverage:"Events with figures", impactNote:"Sum of the latest figure reported for each filtered event (official sources or cited media). Excludes projections and estimates; families are not converted to people; events in the same area may overlap. * = includes partial figures.", impactDetail:"Breakdown by event", eventFilter:"Event", allEvents:"All events", impactLbl:"Repo     dataSourcesHTML:`Data sources: <a href="https://www.openstreetmap.org/copyright" target="_blank" style="color:var(--3is-cyan)">OpenStreetMap</a> · <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" style="color:var(--3is-cyan)">NASA FIRMS</a> (VIIRS heat spots)`,
    bordersNote:"The geographic data, names, and political and administrative boundaries used on this map do not imply official acceptance by 3iS.",
    layerSst:"SST Anomaly (ENSO)", layerBasin:"Amazon basin boundary", fcTitle:"Weather forecast", tabMonitor:"Event monitor", tabForecast:"Forecast", fcRain:"Precipitation", fcTemp:"Temperature", fcRadar:"Weather radar", fcRainAccu:"Rain accumulation", fcThunder:"Thunderstorms", fcNote:"Standalone interactive map (does not include the project boundary or events). Use the timeline at the bottom to move the forecast forward. There are very few radars in the Amazon, so the radar layer will be mostly empty.", fcCredit:"Forecast: Windy.com (free embedded widget, ECMWF model).", firmsLegend:"Heat spots — fire radiative power (FRP, MW)", firmsLegendNote:"Aggregated cells: total FRP of the cell. Points without FRP: class by confidence.", firmsCell:"hotspots in cell", firmsFrp:"FRP", firmsNoFrp:"no FRP (class by confidence)", firms24h:"Last 24 h of data", firmsUpTo:"up to", firmsRange:"Selected dates", firmsNone:"No hotspots on those dates (the map keeps only the last 7 days).", eventDateLbl:"Event", updatedLbl:"Upd.",
    sstNote:"ENSO layer: sea surface temperature anomaly (NASA GIBS, GHRSST L4 MUR product — the same image shown in NASA Worldview) across the equatorial Pacific, with the Niño 1+2, 3, 3.4, and 4 reference regions. It is a predictive indicator for droughts/floods in the Amazon Basin, not an event inside the basin itself — you may need to pan the map toward the Pacific to see it. It typically lags 1-2 days behind.",
    infoHTML:`<p style="margin:0 0 8px"><b style="color:var(--3is-navy)">PRISMA Amazonía</b></p><p style="margin:0 0 12px">Regional Amazon Multi-Hazard Intelligence and Monitoring Platform. Content by tab: <b>Event monitor</b> — active events by hazard and priority; <b>Forecast</b> — precipitation, temperature, radar and thunderstorms; <b>Climate analysis</b> — seasonal climate indicators and trends; <b>IDEAM Alerts</b> — official IDEAM alerts for the Colombian portion of the basin (only visible when filtering by Colombia).</p><p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Alert levels</b></p>
      <p style="margin:0 0 4px"><span style="color:#E24B4A">● Red</span>: confirmed, significant real impact (“Take action”).</p>
      <p style="margin:0 0 4px"><span style="color:#EF9F27">● Orange</span>: real impact reported, but below Red level (“Be prepared”).</p>
      <p style="margin:0 0 4px"><span style="color:#E8C547">● Yellow</span>: active/ongoing event with no confirmed real impact yet (“Be aware”).</p>
      <p style="margin:0 0 8px"><span style="color:#639922">● Green</span>: no real impact reported and the event is already closed, or of minimal severity (“No severe hazard expected”).</p>
      <p style="margin:0 0 12px">Levels follow the Likelihood × Impact matrix from the <i>WMO Guidelines on Multi-hazard Impact-based Forecast and Warning Services</i> (WMO-No. 1150, 2015), the standard UNDRR promotes via Early Warnings for All and the Common Alerting Protocol (not the Sendai Framework). The source’s own alert color is never copied directly.</p>
      <p style="margin:0 0 12px">Active events are re-verified periodically based on hazard type (3-7 days for forecasts, 7-10 for wildfires, 7-14 for rain/floods, 14-30 for river floods/landslides, 30-60 for drought/deforestation). The viewer always shows all active events with no age limit; closed (ENDED) events remain visible for 90 days.</p>
      <p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Methodology and sources</b></p>
      <p style="margin:0 0 4px">Source hierarchy: Tier 1 (GDACS, USGS, WMO, NASA, Copernicus, FAO, OCHA, ReliefWeb, national meteorological/geological services) → Tier 2 (WFP, IFRC, Red Cross) → Tier 3 (credible media) → Tier 4 (social media, lead only, never sole confirmation).</p>
      <p style="margin:0 0 4px">Every event requires cross-checking when possible (ideally official + humanitarian source, or official + credible media). If only one reliable source exists: <code>SINGLE_SOURCE</code>. If sources conflict: <code>CONFLICTING_INFORMATION</code>.</p>
      <p style="margin:0 0 4px">The satellite heat spots (FIRMS) shown on the map cover the last 7 days; for the full historical record, see the <a href="https://firms.modaps.eosdis.nasa.gov/download/" target="_blank" style="color:var(--3is-cyan)">NASA FIRMS Archive Download Tool ↗</a>.</p>
      <p style="margin:0 0 4px">Coordinates in WGS84 (EPSG:4326). Geographic coverage is limited to Bolivia, Brazil, Colombia, Ecuador, Peru, and Venezuela; an event in an eligible country is not automatically included if it occurs outside the Amazon Basin.</p>
      <p style="margin:0">The official basin boundary (the Pan-Amazon layer, including the estuary, excluding Guyana, Suriname and French Guiana, which are outside the project scope) is used as the single source of truth: events and heat spots (FIRMS) with coordinates outside that boundary are excluded from the map and the list, even if they fall inside the geographic search rectangle. The ENSO/SST layer (Pacific) is an external predictive indicator and is not clipped to this boundary.</p>
      <p style="margin:8px 0 0"><a href="https://gdacs.org/" target="_blank" style="color:var(--3is-cyan)">GDACS ↗</a> · <a href="https://reliefweb.int/" target="_blank" style="color:var(--3is-cyan)">ReliefWeb ↗</a> · <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" style="color:var(--3is-cyan)">NASA FIRMS ↗</a></p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Reported affected population</b></p><p style="margin:4px 0 4px">The panel sums, for the events visible under the active filters (country, event type, event, dates and red alerts), the impact figures <b>reported</b> by official sources or cited media: people and families affected, deaths, injured, displaced and evacuated.</p><p style="margin:0 0 4px">Rules: (1) the latest valid figure of each event is used, without accumulating updates; (2) projections, estimates and our own calculations are excluded; (3) families and people are summed separately, with no conversion; (4) <b>*</b> means the total includes partial figures (covering only part of the event area); (5) "Events with figures" shows how many selected events have at least one reported figure.</p><p style="margin:0 0 4px">Limitation: different events in the same area (e.g. drought and fires in the same state) may count the same population; this overlap is not yet corrected. Estimated exposed population (e.g. with WorldPop) is a future development.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Climate monitoring</b></p><p style="margin:4px 0 4px">The "Climate monitoring" tab shows an embedded Power BI dashboard as an interim solution. It is planned to be integrated natively into this viewer (same filters, languages and basin boundary).</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">SST anomaly / ENSO</b></p><p style="margin:4px 0 4px">The "SST Anomaly (ENSO)" layer now uses the official public tile straight from <b>NASA GIBS</b> (GHRSST L4 MUR product, the same image shown in NASA Worldview), instead of being computed daily via Google Earth Engine. It is now <b>on by default</b> and has its own colour legend (bottom-right corner of the map) using NASA's official scale. The image typically lags 1-2 days, which is fine for a slow-moving indicator like ENSO. The previous Earth Engine computation code is kept, unused, under <code>legacy/enso_gee_pipeline/</code> in the repository, as a record of past work.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Regional situational report</b></p><p style="margin:4px 0 4px">The "Quarterly report" button downloads the latest approved Regional Situational Report (PDF), summarising the quarter for the 6 project countries: period events, reported impact, sector-level Anticipatory Action relevance and recommendations, with mandatory human review before publication. The currently available report covers 2026-Q3 (1 Aug - 30 Sep 2026), published 2026-10-26 (last updated 2026-10-28).</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Download menu and monthly report by country</b></p><p style="margin:4px 0 4px">The separate "Export CSV" and "Quarterly report" buttons were merged into a single "Download" dropdown menu, which also adds "Monthly report by country" with a submenu to pick the country. Monthly report links point to a fixed per-country path (<code>Reports/Informe_mensual_&lt;country&gt;_vigente.pdf</code>) that does not exist yet -- they will download a 404 until the first monthly report is published, expected behaviour, the same as the quarterly report before its first publication.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">IDEAM Alerts</b></p><p style="margin:4px 0 0">New "IDEAM Alerts - Colombia" tab with its own map integrating IDEAM\u2019s 3 public layers (hydrology, landslides and wildfires), filtered to the Colombian Amazon basin area (Amazonas, Caqueta, Putumayo). These are early-warning hazard indices (HIGH/MODERATE/LOW, or currently active hydrological alerts), not confirmed events: they are therefore not added to Events/ and do not receive an Event_ID, and they do not accumulate their own history \u2014 each daily update replaces the previous one. The hydrology layer may appear empty on days with no active alert in the Amazon basin; this is expected, not an error. The tab only appears when the Monitor's country filter is set to Colombia (IDEAM only covers Colombia). Map popups now show which of the 3 layers a record belongs to (hydrology, landslides or wildfires), and the legend unifies color with one common severity tier (High/Medium/Low), showing underneath IDEAM's own native term for each layer -- e.g. "Red Alert" in hydrology is equivalent to "High Threat" in landslides/wildfires. The source note no longer mentions "no authentication required" (irrelevant to the user); it now just says "public data". Updated automatically every day from IDEAM\u2019s official data.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Version history</b></p><p style="margin:4px 0 0">2026-10-13: reported affected population KPI, filterable by country, event type and event. 2026-10-13: Climate monitoring tab (interim). 2026-10-14: the ENSO/SST layer now uses the official NASA GIBS tile directly (previously Google Earth Engine), on by default with its own legend. 2026-10-21: download button for the quarterly Regional Situational Report (PDF), with deterministic data generation and analytical narrative reviewed by a human before publication. 2026-10-22: "Download" dropdown menu grouping the events CSV, the quarterly report and the new monthly report by country (fixed per-country link, not generated yet); also fixes the language selector overlapping the banner title at medium widths, replaced with a language button/icon. 2026-10-27: new "IDEAM Alerts" tab with IDEAM\u2019s 3 early-warning layers for the Colombian Amazon basin. 2026-10-29: "Last updated" now reflects the most recent of events, FIRMS hotspots and IDEAM Alerts (previously it only tracked the last edited event, which could lag several days behind). 2026-11-06: ALERT_PRIORITY moves to 4 levels (RED/ORANGE/YELLOW/GREEN, WMO-1150); title renamed to "Risk Observatory"; banner subtitle now dynamic per tab; logos nudged up 10px. 2026-11-13: renamed to "PRISMA Amazonia" (Regional Amazon Multi-Hazard Intelligence and Monitoring Platform); banner background changes from gradient to white; the CUENCA project logo is added alongside the 3iS and European Union ones; the banner subtitle stops varying by tab and always shows the full name instead (per-tab content moved to the "About" panel); the tabs bar moves to its own row below the logos.</p><p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Project scope</b></p>
      <p style="margin:4px 0 0">This monitor supports "Strengthening Response Capacity in the Amazon Basin," funded by the European Commission (DG ECHO), implemented from 01/06/2026 to 31/05/2028 by a consortium led by Diakonie Katastrophenhilfe (DKH) together with World Vision, 3iS, and PREDES. Coverage: Bolivia, Brazil, Colombia, Ecuador, Peru, and Venezuela.</p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88;font-size:11px;font-weight:700;text-align:center">Developed by:</p>

};

// Ray-casting simple sobre un GeoJSON Polygon/MultiPolygon (con huecos) para
// saber si un punto [lat,lon] cae dentro. No depende de ninguna libreria
// externa (Turf, etc.) -- el sitio ya evita sumar dependencias de JS.
function pointInRing(lat, lon, ring){
  var inside = false;
  for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    var xi = ring[i][0], yi = ring[i][1];
    var xj = ring[j][0], yj = ring[j][1];
    var intersect = ((yi > lat) !== (yj > lat)) &&
      (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}
function pointInPolygonCoords(lat, lon, polygonCoords){
  // polygonCoords: [ [ [lon,lat], ... ] (anillo exterior), [ ... ] (huecos), ... ]
  if (!polygonCoords.length || !pointInRing(lat, lon, polygonCoords[0])) return false;
  for (var h = 1; h < polygonCoords.length; h++) {
    if (pointInRing(lat, lon, polygonCoords[h])) return false; // cae en un hueco
  }
  return true;
}
function pointInBasin(lat, lon){
  if (!AMAZON_BASIN_GEOJSON) return true; // sin poligono cargado, no se filtra nada
  var feats = AMAZON_BASIN_GEOJSON.features || [];
  for (var f = 0; f < feats.length; f++) {
    var geom = feats[f].geometry;
    if (!geom) continue;
    if (geom.type === 'Polygon') {
      if (pointInPolygonCoords(lat, lon, geom.coordinates)) return true;
    } else if (geom.type === 'MultiPolygon') {
      for (var p = 0; p < geom.coordinates.length; p++) {
        if (pointInPolygonCoords(lat, lon, geom.coordinates[p])) return true;
      }
    }
  }
  return false;
}

const HAZARD_ORDER = ["WILDFIRE","FLOOD","FLASH_FLOOD","EXTREME_RAIN","DROUGHT","LANDSLIDE","EARTHQUAKE","EXTREME_HEAT","SEVERE_STORM","DEFORESTATION"];

const PRIORITY_COLOR = { RED:"#E24B4A", ORANGE:"#EF9F27", YELLOW:"#E8C547", GREEN:"#639922" };
// Clases de severidad FIRMS segun la potencia radiativa del fuego (FRP, MW).
// En celdas agregadas se usa la FRP total de la celda. Escala de grises:
// claro/pequeno = menos intenso, oscuro/grande = mas intenso.
const FIRMS_CLASSES = [
  { max: 5,        radius: 2.5, fill: "#D0D0D0", label: "< 5" },
  { max: 25,       radius: 3.5, fill: "#A0A0A0", label: "5 – 25" },
  { max: 100,      radius: 5,   fill: "#707070", label: "25 – 100" },
  { max: 500,      radius: 7,   fill: "#404040", label: "100 – 500" },
  { max: Infinity, radius: 10,  fill: "#111111", label: "≥ 500" }
];
// Respaldo para puntos sin FRP (datos anteriores al cambio): clase por confianza.
const FIRMS_CONF_CLASS = { low:0, l:0, nominal:1, n:1, high:2, h:2 };
function firmsClassIndex(p){
  var v = (p.frp_sum != null) ? p.frp_sum : p.frp;
  if (v == null || isNaN(v)) return (FIRMS_CONF_CLASS[p.confidence] != null) ? FIRMS_CONF_CLASS[p.confidence] : 1;
  for (var i = 0; i < FIRMS_CLASSES.length; i++) { if (v < FIRMS_CLASSES[i].max) return i; }
  return FIRMS_CLASSES.length - 1;
}

function presentHazards(){
  var set = {};
  EVENTS.forEach(function(e){ set[e.hazard] = true; });
  var ordered = HAZARD_ORDER.filter(function(h){ return set[h]; });
  Object.keys(set).forEach(function(h){ if (ordered.indexOf(h) === -1) ordered.push(h); });
  return ordered;
}
function presentCountries(){
  var set = {};
  EVENTS.forEach(function(e){ set[e.country] = true; });
  return Object.keys(set).sort();
}

function inDateRange(e){
  var d = e.eventDate || e.firstDetected;
  if (dateFrom && d < dateFrom) return false;
  if (dateTo && d > dateTo) return false;
  return true;
}
// Progreso 1: getFiltered() = filtros base (pais/tipo/prioridad/fechas/cuenca)
// + filtro opcional por evento puntual. getFilteredBase() alimenta el selector
// de eventos, para que la lista de eventos se ajuste a los demas filtros.
function getFiltered(){
  var base = getFilteredBase();
  if (!activeEventId) return base;
  return base.filter(function(e){ return e.id === activeEventId; });
}

function computeRedAlertCount(){
  // Igual que getFiltered(), pero ignorando activePriority a proposito: el
  // banner debe seguir mostrando cuantas alertas rojas hay (segun pais/fecha
  // actuales) incluso despues de que el propio banner haya activado el
  // filtro por prioridad RED.
  return EVENTS.filter(function(e){
    if (activeCountry && e.country !== activeCountry) return false;
    if (activeHazard && e.hazard !== activeHazard) return false;
    if (activeEventId && e.id !== activeEventId) return false;
    if (!inDateRange(e)) return false;
    if (typeof e.lat === 'number' && typeof e.lon === 'number' && !isNaN(e.lat) && !isNaN(e.lon)) {
      if (!pointInBasin(e.lat, e.lon)) return false;
    }
    return e.priority === 'RED';
  }).length;
}

function getFilteredBase(){
  return EVENTS.filter(function(e){
    if (activeCountry && e.country !== activeCountry) return false;
    if (activeHazard && e.hazard !== activeHazard) return false;
    if (activePriority && e.priority !== activePriority) return false;
    if (!inDateRange(e)) return false;
    // Filtro defensivo del lado del cliente: si el evento SI tiene coordenadas
    // y el poligono real de la cuenca ya cargo, se oculta cualquier evento que
    // caiga fuera de la forma real (amazon_basin.geojson), aunque haya pasado
    // el filtro de pais/rectangulo en el origen de datos. Un evento sin
    // coordenadas (lat/lon NULL, pendiente de verificacion geografica) nunca
    // se descarta por esto -- no hay como probarlo, y ya se marca aparte con
    // su propio estado de verificacion.
    if (typeof e.lat === 'number' && typeof e.lon === 'number' && !isNaN(e.lat) && !isNaN(e.lon)) {
      if (!pointInBasin(e.lat, e.lon)) return false;
    }
    return true;
  });
}

// Devuelve los bounds reales del pais (geometria oficial via COUNTRY_FEATURES),
// o la caja aproximada COUNTRY_BOUNDS como respaldo si la geometria real
// todavia no cargo (fetch en curso) o fallo.
function countryZoomBounds(c){
  var iso3 = COUNTRY_ISO3[c];
  var feat = iso3 && COUNTRY_FEATURES[iso3];
  if (feat) {
    try { return L.geoJSON(feat).getBounds(); } catch(e){}
  }
  return COUNTRY_BOUNDS[c] ? L.latLngBounds(COUNTRY_BOUNDS[c]) : null;
}

// Dibuja el limite real del pais activo resaltado (color propio, mas grueso
// que el limite nacional normal) en su propio pane, por encima de la cuenca.
function renderCountryHighlight(){
  if (!countryHighlightLayer) return;
  countryHighlightLayer.clearLayers();
  if (!activeCountry) return;
  var iso3 = COUNTRY_ISO3[activeCountry];
  var feat = iso3 && COUNTRY_FEATURES[iso3];
  if (!feat) return;
  L.geoJSON(feat, {
    pane: 'countryHighlightPane', interactive: false,
    style: { color: '#4CDBB0', weight: 4, opacity: 1, fill: false }
  }).addTo(countryHighlightLayer);
}

// Zoom a los eventos actualmente filtrados (pais + amenaza + fecha); si no
// hay ninguno con coordenadas, cae a fallbackBounds (p.ej. el pais activo) y,
// si tampoco hay eso, vuelve a la vista por defecto de toda la cuenca.
function zoomToFilteredEvents(fallbackBounds){
  if (!map) return;
  var pts = getFiltered().filter(function(e){
    return typeof e.lat === 'number' && typeof e.lon === 'number' && !isNaN(e.lat) && !isNaN(e.lon);
  });
  if (pts.length) {
    map.fitBounds(L.latLngBounds(pts.map(function(e){ return [e.lat, e.lon]; })), { padding: [40, 40], maxZoom: 8 });
  } else if (fallbackBounds) {
    map.fitBounds(fallbackBounds, { padding: [20, 20] });
  } else {
    map.setView(DEFAULT_MAP_CENTER, DEFAULT_MAP_ZOOM);
  }
}

// Focos FIRMS de las ultimas 24h "reales" (desde la observacion mas reciente
// del archivo), SIN depender del filtro de fechas ni de la linea de tiempo
// del mapa -- es una foto fija de "condiciones actuales", igual que las
// tarjetas de arriba del dashboard de Uganda que inspiraron esta idea.
function computeFirms24hStats(){
  var all = (typeof FIRMS_HOTSPOTS !== 'undefined' ? FIRMS_HOTSPOTS : []);
  var basinOk = all.filter(function(p){ return !(AMAZON_BASIN_GEOJSON && !pointInBasin(p.lat, p.lon)); });
  var maxT = null, maxDate = '';
  basinOk.forEach(function(p){
    var ms = firmsTime(p);
    if (ms != null && (maxT == null || ms > maxT)) maxT = ms;
    if (p.date > maxDate) maxDate = p.date;
  });
  var cut = (maxT != null) ? maxT - 24 * 3600 * 1000 : null;
  var refDate = (maxT != null) ? new Date(maxT).toISOString().slice(0,10) : maxDate;
  var count = 0, maxFrp = null;
  basinOk.forEach(function(p){
    var ms = firmsTime(p);
    var inWindow = (ms == null) ? (p.date === refDate) : (cut != null && ms > cut);
    if (!inWindow) return;
    count++;
    var v = (p.frp_sum != null) ? p.frp_sum : p.frp;
    if (v != null && (maxFrp == null || v > maxFrp)) maxFrp = v;
  });
  return { count: count, maxFrp: maxFrp };
}

function isNum(v){ return typeof v === 'number' && isFinite(v); }
function fmtNum(n){
  var loc = currentLang === 'en' ? 'en-US' : (currentLang === 'pt' ? 'pt-BR' : 'es-CO');
  try { return new Intl.NumberFormat(loc).format(n); } catch (err) { return String(n); }

function escHtml(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
function hasImpactFigure(e){

// Ventana temporal de FIRMS. Sin fechas en el panel: ultimas 24 h de datos,
// contadas desde la observacion mas reciente del archivo (no desde "ahora",
// para que el mapa no quede vacio si la corrida diaria aun no ha pasado).
// Con fechas en el panel: los focos de esos dias (misma logica que noticias).
var FIRMS_WINDOW = { mode: '24h', maxT: null, count: 0 };
function firmsTime(p){
  if (!p.time) return null;
  var hhmm = String(p.time); while (hhmm.length < 4) hhmm = '0' + hhmm;
  var ms = Date.parse(p.date + 'T' + hhmm.slice(0,2) + ':' + hhmm.slice(2,4) + ':00Z');
  return isNaN(ms) ? null : ms;
}
function selectFirmsWindow(all){
  if (FIRMS_TIMELINE_DATE) {
    // Linea de tiempo manual: congela el mapa en un dia concreto de los
    // ultimos 7, sin importar el filtro de fechas de noticias.
    FIRMS_WINDOW = { mode: 'timeline', date: FIRMS_TIMELINE_DATE };
    return all.filter(function(p){ return p.date === FIRMS_TIMELINE_DATE; });
  }
  if (dateFrom || dateTo) {
    FIRMS_WINDOW = { mode: 'range', maxT: null };
    return all.filter(function(p){
      if (dateFrom && p.date < dateFrom) return false;
      if (dateTo && p.date > dateTo) return false;
      return true;
    });
  }
  var maxT = null, maxDate = '';
  all.forEach(function(p){
    var ms = firmsTime(p);
    if (ms != null && (maxT == null || ms > maxT)) maxT = ms;
    if (p.date > maxDate) maxDate = p.date;
  });
  FIRMS_WINDOW = { mode: '24h', maxT: maxT, maxDate: maxDate };
  var cut = (maxT != null) ? maxT - 24 * 3600 * 1000 : null;
  var refDate = (maxT != null) ? new Date(maxT).toISOString().slice(0,10) : maxDate;
  return all.filter(function(p){
    var ms = firmsTime(p);
    // puntos sin hora (datos previos al cambio): se aproximan por el dia mas reciente
    if (ms == null) return p.date === refDate;
    return ms > cut;
  });
}

function renderFirmsMarkers(){
  if (!firmsLayer) return;
  firmsLayer.clearLayers();
  var all = (typeof FIRMS_HOTSPOTS !== 'undefined' ? FIRMS_HOTSPOTS : []);
  var pts = selectFirmsWindow(all).filter(function(p){
    // Filtro defensivo del lado del cliente (el principal corre en
    // fetch_and_publish.py): descarta lo que caiga fuera de la cuenca real.
    return !(AMAZON_BASIN_GEOJSON && !pointInBasin(p.lat, p.lon));
  }).map(function(p){ return { p: p, c: firmsClassIndex(p) }; });
  // Los mas intensos se dibujan al final, encima, para que resalten.
  pts.sort(function(a, b){ return a.c - b.c; });
  FIRMS_WINDOW.count = pts.length;
  pts.forEach(function(o){
    var p = o.p, k = FIRMS_CLASSES[o.c];
    var m = L.circleMarker([p.lat, p.lon], {
      renderer: firmsRenderer, radius: k.radius, color: '#ffffff', weight: 0.6, opacity: 0.9,
      fillColor: k.fill, fillOpacity: 0.85
    });
    var frpVal = (p.frp_sum != null) ? p.frp_sum : p.frp;
    var when = p.date + (p.time ? ' ' + String(p.time).padStart(4,'0').replace(/(\d\d)(\d\d)/, '$1:$2') + ' UTC' : '');
    var lines = [p.satellite + ' · ' + when + ' · ' + p.confidence];
    if (p.count) lines.push(p.count + ' ' + t('firmsCell'));
    lines.push(frpVal != null ? t('firmsFrp') + ': ' + (Math.round(frpVal * 10) / 10) + ' MW' : t('firmsNoFrp'));
    m.bindPopup('<div style="font-size:12px"><b>' + t('layerFirms') + '</b><br>' + lines.join('<br>') + '</div>');
    m.addTo(firmsLayer);
  });
  updateFirmsLegend();
  renderFirmsTimelineControl();
}

// --- Linea de tiempo FIRMS: slider de dias (ultimos 7, segun lo que trae el

// toca el filtro de fechas de noticias ni el resto del dashboard. ---
function firmsTimelineDates(){
  var set = {};
  (FIRMS_HOTSPOTS || []).forEach(function(p){ if (p.date) set[p.date] = true; });
  return Object.keys(set).sort(); // ascendente, el archivo solo guarda ~7 dias
}
var FIRMS_TIMELINE_MONTHS = {
  es: ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],
  pt: ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],
  en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
};
function firmsTimelineDateLabel(d){
  var parts = d.split('-');
  var months = FIRMS_TIMELINE_MONTHS[currentLang] || FIRMS_TIMELINE_MONTHS.en;
  return parts[2] + ' ' + (months[parseInt(parts[1], 10) - 1] || parts[1]);
}
function stopFirmsTimelinePlay(){
  if (firmsTimelineTimer) { clearInterval(firmsTimelineTimer); firmsTimelineTimer = null; }
}
function setFirmsTimelineDate(d){
  stopFirmsTimelinePlay();
  FIRMS_TIMELINE_DATE = d;
  renderFirmsMarkers(); // esto ya vuelve a llamar renderFirmsTimelineControl() al final

function toggleFirmsTimelinePlay(){
  if (firmsTimelineTimer) { stopFirmsTimelinePlay(); renderFirmsTimelineControl(); return; }
  var dates = firmsTimelineDates();
  if (!dates.length) return;
  var idx = dates.indexOf(FIRMS_TIMELINE_DATE);
  firmsTimelineTimer = setInterval(function(){
    idx = (idx + 1) % dates.length;
    FIRMS_TIMELINE_DATE = dates[idx];
    renderFirmsMarkers();
  }, 1200);
  renderFirmsTimelineControl();
}

  playBtn.textContent = firmsTimelineTimer ? '⏸' : '▶';

// Leyenda de FIRMS (tamano + gris por clase de FRP). Solo visible si la capa esta encendida.

// --- Pronostico (widget embebido de Windy) ---
// Cada boton cambia la capa del iframe; el mapa se centra en la cuenca.
const WINDY_LAYERS = [
  { overlay: 'rain', key: 'fcRain' },
  { overlay: 'temp', key: 'fcTemp' },
  { overlay: 'radar', key: 'fcRadar' },
  { overlay: 'rainAccu', key: 'fcRainAccu' },
  { overlay: 'thunder', key: 'fcThunder' }
];
let windyOverlay = 'rain';
function windySrc(overlay){
  var q = {
    type: 'map', location: 'coordinates', lat: -6, lon: -62, detailLat: -6, detailLon: -62,
    zoom: 4, level: 'surface', overlay: overlay, product: 'ecmwf',
    width: 1000, height: 480, menu: '', message: 'true', marker: '', calendar: 'now',
    pressure: '', detail: '', metricWind: 'km/h', metricTemp: '°C', radarRange: '-1'
  };
  return 'https://embed.windy.com/embed2.html?' + Object.keys(q).map(function(k){
    return k + '=' + encodeURIComponent(q[k]);
  }).join('&');
}
function renderForecast(){
  var wrap = document.getElementById('forecastLayers');
  var frame = document.getElementById('windyFrame');
  if (!wrap || !frame) return;
  wrap.innerHTML = '';
  WINDY_LAYERS.forEach(function(l){
    var b = document.createElement('button');
    b.className = 'chip' + (l.overlay === windyOverlay ? ' active' : '');
    b.textContent = t(l.key);
    b.onclick = function(){ windyOverlay = l.overlay; renderForecast(); };
    wrap.appendChild(b);
  });
  if (activeTab !== 'forecast') return; // el iframe se carga solo al abrir la pestana
  var src = windySrc(windyOverlay);
  if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
}

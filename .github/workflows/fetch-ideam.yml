# Sube este archivo al repo en la ruta exacta: .github/workflows/fetch-ideam.yml
#
# Que hace: cada dia, consulta las 3 capas publicas y gratuitas de IDEAM
# (bart.ideam.gov.co, sin API key) y escribe IDEAM_Alerts/hidrologia.geojson,
# IDEAM_Alerts/deslizamientos.geojson e IDEAM_Alerts/incendios.geojson con
# las alertas vigentes hoy en la porcion colombiana de la Cuenca Amazonica
# (Amazonas, Caqueta, Putumayo). Es 100% determinista
# (scripts/fetch_ideam_alerts.py) -- no llama a ningun modelo de IA, por lo
# que no tiene costo de tokens.
#
# IMPORTANTE: estas 3 capas son INDICES DE AMENAZA/ALERTA de IDEAM (no
# eventos confirmados del monitor). Este workflow NUNCA escribe en Events/
# ni en Impacts/, y nunca crea ni actualiza un Event_ID. Se muestran en el
# visor como una capa de alerta temprana aparte, en la pestana "Alertas
# IDEAM".
#
# Corre 1 hora antes del workflow de GDACS y 3 horas antes de la tarea
# diaria de Cowork, para que la capa este fresca cuando el usuario abra el
# visor en la manana.

name: Alertas IDEAM (hidrologia, deslizamientos, incendios)

on:
  schedule:
    # 11:00 UTC = 06:00 America/Bogota (Bogota es UTC-5 todo el ano).
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # permite darle "Run workflow" manualmente desde GitHub

permissions:
  contents: write  # necesario para que el workflow pueda hacer commit y push

concurrency:
  group: fetch-ideam
  cancel-in-progress: false

jobs:
  fetch-ideam:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (pyshp para leer el shapefile de hidrologia)
        run: pip install pyshp

      - name: Consultar IDEAM y escribir IDEAM_Alerts/*.geojson
        run: python scripts/fetch_ideam_alerts.py

      - name: Hacer commit y push solo si algo cambio
        run: |
          git config user.name "amazon-basin-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add IDEAM_Alerts/hidrologia.geojson IDEAM_Alerts/deslizamientos.geojson IDEAM_Alerts/incendios.geojson IDEAM_Alerts/meta.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las alertas IDEAM hoy."
          else
            git commit -m "Actualizacion automatica de alertas IDEAM ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

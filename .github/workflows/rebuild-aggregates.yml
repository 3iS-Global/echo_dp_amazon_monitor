# Sube este archivo al repo en la ruta exacta: .github/workflows/rebuild-aggregates.yml
# (reemplaza la version anterior que subiste - esta corrige un bug real)
#
# Que hace: cada vez que se agrega o modifica un archivo en Events/, reconstruye
# index.json, events.json, meta.json y los CSV trimestrales-reporte a partir de
# los archivos individuales de Events/ (la fuente de verdad). Es 100% determinista
# (scripts/rebuild_aggregates.py) - no llama a ningun modelo ni API externa, por
# lo que no tiene costo de tokens y corre en segundos.
#
# Se dispara por push sobre Events/** (inmediato, sin depender de un cron que
# tenga que adivinar si Cowork ya termino) y tambien admite correrse a mano
# desde la pestana "Actions" del repo.
#
# (01-11-2026): comparte grupo de concurrencia con publish.yml y
# fetch-ideam.yml (ver mas abajo), que desde esta fecha tambien corren con
# cada push a main -- asi los tres se encolan en vez de competir por el
# push cuando un mismo push los dispara a la vez.
#
# (06-11-2026): tambien corre con su propio schedule diario (20:17 UTC =
# 15:17 America/Bogota, fuera de los horarios de fetch-ideam/publish y del
# rango 14:00-17:00 UTC con mayor riesgo de retraso en GitHub Actions). El
# "Ultima actualizacion" del dashboard se habia quedado congelado mas de una
# semana porque este workflow SOLO se disparaba por push a Events/**, y en
# dias sin eventos nuevos simplemente no corria. meta.json["lastUpdated"] ya
# escribe datetime.now(utc) en cada corrida (ver rebuild_aggregates.py), asi
# que basta con garantizar que el workflow corra todos los dias para que esa
# fecha nunca se congele, haya o no eventos nuevos ese dia.

name: Reconstruir agregados desde Events/

on:
  push:
    # Solo la rama main: sin este filtro, empujar una etiqueta (p. ej. progreso-1)
    # tambien dispara el workflow, que corre en "detached HEAD" y falla al hacer push.
    branches:
      - main
    paths:
      - "Events/**"
      - "Impacts/**"
  schedule:
    # Heartbeat diario: garantiza que meta.json (y por tanto "Ultima
    # actualizacion" en el dashboard) se reescriba todos los dias, incluso
    # sin eventos nuevos. 20:17 UTC = 15:17 America/Bogota.
    - cron: "17 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # necesario para que el workflow pueda hacer commit y push

# Evita que dos reconstrucciones simultaneas (p. ej. dos pushes seguidos) choquen al hacer push.
# (01-11-2026): el grupo ahora es compartido con publish.yml y fetch-ideam.yml.
concurrency:
  group: amazon-monitor-main-writes
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruir index.json, events.json, meta.json y CSV trimestrales
        run: python scripts/rebuild_aggregates.py

      - name: Hacer commit y push solo si algo cambio
        run: |
          shopt -s nullglob
          git config user.name "amazon-basin-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          archivos=(index.json events.json meta.json Amazon_Basin_Disaster_Events_*.csv)
          git add "${archivos[@]}"
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar hoy."
          else
            git commit -m "Reconstruccion automatica de agregados ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
